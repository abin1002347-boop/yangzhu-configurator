  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #2D7D46;
      --green-dark: #1f5c33;
      --green-light:#e8f5e9;
      --green-logo: #4d7c14;
      --gray-400:   #9ca3af;
      --gray-600:   #4b5563;
      --gray-900:   #111827;
      --white:      #ffffff;
    }

    html, body {
      height: 100%;
    }
    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: var(--white);
      color: var(--gray-900);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      padding: 18px 24px;
      display: flex;
      justify-content: center;
    }
    .site-logo { display: flex; align-items: center; text-decoration: none; }
    .logo-img { height: 36px; width: auto; display: block; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .notfound-wrap {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 40px 32px;
      background: var(--green-light);
      border-radius: 16px;
    }
    .notfound-code {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: .08em;
      margin-bottom: 12px;
    }
    .notfound-wrap h1 {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 900;
      color: var(--gray-900);
      margin-bottom: 12px;
    }
    .notfound-wrap p {
      font-size: 14.5px;
      color: var(--gray-600);
      line-height: 1.8;
      margin-bottom: 28px;
    }
    .notfound-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .notfound-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, border-color .2s;
    }
    .notfound-btn.primary {
      background: var(--green);
      color: white;
      border: 2px solid var(--green);
    }
    .notfound-btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
    .notfound-btn.secondary {
      background: transparent;
      color: var(--green);
      border: 2px solid var(--green);
    }
    .notfound-btn.secondary:hover { background: rgba(45,125,70,0.08); }

    .notfound-contact {
      font-size: 13px;
      color: var(--gray-600);
      border-top: 1px solid rgba(0,0,0,0.06);
      padding-top: 18px;
    }
    .notfound-contact a { color: var(--green); font-weight: 600; text-decoration: none; }
    .notfound-contact a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .notfound-wrap { padding: 32px 22px; }
    }
  </style>
</head>

<header class="site-header">

    <svg class="logo-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 48" width="178" height="48" aria-label="楊竹科技 YangZhu">

      <text x="1" y="45"
            font-family="Georgia,'Palatino Linotype',serif"
            font-size="32" font-style="italic" font-weight="700" fill="#4d7c14">YangZhu</text>

</header>

<main>

      <a class="notfound-btn secondary" href="/customize">開始客製化</a>

    <p class="notfound-contact">

  </div>
