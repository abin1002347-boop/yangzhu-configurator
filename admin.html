<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單管理 — 楊竹科技後台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="/admin/admin-style.css">
<style>
  /* 訂單管理頁專屬樣式（列表/密碼登入畫面），顏色與版面沿用上面兩份共用樣式表 */
  /* 這個登入畫面的綠改用官網 yangzhu.com.tw 實際的品牌綠（#7ba918），跟本頁其他地方
     （按鈕、訂單狀態徽章）用的 --green（#2D7D46）是兩套不同色系，只在 #gate 這個
     區塊內用 CSS 變數局部覆蓋，範圍不外溢到登入之後的訂單管理介面。 */
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    --yz-green: #7ba918; --yz-green-dark: #496b00; --yz-green-pale: #EFF5E3;
    position: relative; overflow: hidden;
  }
  /* 背景裝飾：使用者提供的竹林插畫，已用 Pillow 轉成官網品牤綠雙色調（原圖偏藍綠色，
     跟品牌色不合），存在 assets/gate-bg-bamboo.jpg。這裡再用低透明度淡化，當作登入
     畫面背景，不搶卡片的注意力。 */
  .gate-bg-photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .3; pointer-events: none; z-index: 0;
  }
  #gate-card {
    width: 100%; max-width: 380px; background: var(--white);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-lg);
    position: relative; z-index: 1;
  }
  #gate-band {
    background: linear-gradient(160deg, var(--yz-green) 0%, var(--yz-green-dark) 100%);
    padding: 40px 32px 32px; text-align: center;
  }
  .gate-logo { display: inline-flex; }
  .gate-logo svg { display: block; }
  #gate-form { padding: 30px 32px 32px; text-align: center; }
  #gate h2 { font-size: 19px; font-weight: 700; color: var(--gray-900); letter-spacing: .3px; margin: 0 0 6px; }
  #gate p { font-size: 13px; color: var(--gray-400); margin: 0 0 24px; }
  #gate input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200); background: var(--gray-100);
    border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #gate input:focus {
    outline: none; border-color: var(--yz-green); background: var(--white);
    box-shadow: 0 0 0 3px var(--yz-green-pale);
  }
  #gate button {
    width: 100%; padding: 13px; border: none; border-radius: 50px;
    background: var(--yz-green); color: white; font-size: 14px; font-weight: 700; cursor: pointer;
    margin-top: 6px; box-shadow: var(--shadow-sm); transition: background .15s, box-shadow .15s, transform .1s;
  }
  #gate button:hover { background: var(--yz-green-dark); box-shadow: var(--shadow-md); }
  #gate button:active { transform: scale(.98); }
  #gate button:focus-visible { outline: 2px solid var(--yz-green-dark); outline-offset: 2px; }
  #gate-error { color: #dc2626; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  /* 畫面上不顯示文字，但螢幕報讀軟體讀得到，也讓input能透過label正確關聯（不只靠
     placeholder——placeholder不是label，欄位內容一輸入placeholder就消失，且部分
     輔助工具不會把placeholder當成欄位名稱朗讀）。 */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .order-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .order-tab-btn {
    padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--gray-200);
    background: var(--white); font-size: 13px; font-weight: 700; cursor: pointer;
    color: var(--gray-700); font-family: inherit;
  }
  .order-tab-btn:hover { border-color: var(--green); color: var(--green); }
  .order-tab-btn.active { background: var(--green); border-color: var(--green); color: white; }
  .order-tab-btn.active:hover { color: white; }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type=search] {
    flex: 1; min-width: 200px; padding: 9px 14px; border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
  }
  .toolbar button {
    padding: 9px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200);
    background: var(--white); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--gray-700);
    font-family: inherit;
  }
  .toolbar button.primary { background: var(--green); border-color: var(--green); color: white; }
  .toolbar button:hover { border-color: var(--green); color: var(--green); }
  .toolbar button.primary:hover { color: white; background: var(--green-dark); }
  .toolbar .stat { font-size: 13px; color: var(--gray-400); }
  .toolbar select, .toolbar input[type=date] {
    padding: 8px 10px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; color: var(--gray-700); background: var(--white);
    /* min-width:0 讓 <select> 在 flex 版面下可以縮到比內容還窄（避免瀏覽器依「最長選項文字」
       撐開元素寬度，例如網址帶入的商品篩選參數可能是很長的商品名稱）；max-width:100% 確保
       視覺上絕對不會超過 toolbar 目前的可視寬度，超長文字用省略號截斷，不會撐開整列版面。 */
    min-width: 0; max-width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  }
  .toolbar .filter-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--gray-400); }

  table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius); overflow: hidden; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
  th { background: var(--gray-100); font-size: 12px; color: var(--gray-700); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.note { max-width: 220px; white-space: pre-wrap; font-size: 12.5px; color: var(--gray-700); }
  .qty { font-variant-numeric: tabular-nums; }
  .price { font-weight: 700; color: var(--green); white-space: nowrap; }
  .order-status-btn {
    padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
    border: 1.5px solid var(--gray-200); background: var(--white); cursor: pointer; white-space: nowrap;
    display: inline-block; text-decoration: none; font-family: inherit;
  }
  .order-status-btn.factory { border-color: var(--green); color: var(--green); margin-left: 6px; }
  .order-status-btn.factory:hover { background: var(--green-pale); }
  .status-select {
    padding: 4px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
    border: 1.5px solid var(--gray-200); background: var(--white); cursor: pointer; font-family: inherit;
  }
  .status-select:disabled { opacity: .55; cursor: wait; }
  .status-select.status-new_inquiry   { border-color: var(--gray-200); color: var(--gray-700); }
  .status-select.status-quoted        { border-color: #f59e0b; color: #b45309; background: #fef3c7; }
  .status-select.status-closed_won    { border-color: var(--green); color: var(--green); background: var(--green-pale); }
  .status-select.status-in_production { border-color: #8b5cf6; color: #6d28d9; background: #ede9fe; }
  .status-select.status-qc            { border-color: #ec4899; color: #be185d; background: #fce7f3; }
  .status-select.status-ready_to_ship { border-color: #06b6d4; color: #0e7490; background: #cffafe; }
  .status-select.status-shipped       { border-color: #2563eb; color: #1d4ed8; background: #dbeafe; }
  .status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11.5px;
    font-weight: 700; white-space: nowrap; border: 1.5px solid transparent;
  }
  .status-badge.status-completed { background: var(--green-pale); color: var(--green); border-color: var(--green); }
  .status-badge.status-cancelled { background: #fee2e2; color: #dc2626; border-color: #dc2626; }
  .empty { text-align: center; padding: 60px 20px; color: var(--gray-400); font-size: 14px; }
  .disclaimer { font-size: 11.5px; color: var(--gray-400); margin-top: 14px; line-height: 1.7; }
  .order-no { font-weight: 700; color: var(--gray-900); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .factory-badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 10.5px; font-weight: 700; white-space: nowrap; margin-bottom: 4px;
  }
  .factory-badge.pending { background: #fee2e2; color: #dc2626; }
  .factory-badge.done    { background: var(--green-pale); color: var(--green); }

  /* ─── 操作欄縮短：原本查看詳情／列印／封存／下載狀態／下載工廠包五個項目直排、中間用
     兩個<br>隔開，每一列會被撐得很高；改成兩行橫排——第一行放最常用的「查看詳情」＋收合
     「列印」「封存」的「更多」選單，第二行放「下載工廠包」＋下載狀態徽章。 ─── */
  .order-actions-cell { min-width: 168px; }
  .order-actions-row { display: flex; align-items: center; gap: 6px; }
  .order-actions-row + .order-actions-row { margin-top: 6px; }
  .order-actions-row .factory-badge { margin-bottom: 0; }
  /* 「更多」選單是共用的單一浮動面板（position:fixed，用JS依按鈕位置即時定位），不是每列
     各自建立一個——表格外層 .admin-table-wrap 有 overflow-y:hidden（避免水平捲動時版面跑掉），
     如果選單改成每列自己 position:absolute 展開，會被這層 overflow 裁掉看不見；用 fixed
     定位到body底下，就不受表格容器的 overflow 影響。 */
  .order-more-menu {
    position: fixed; z-index: 2000; display: none;
    background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md); padding: 4px; min-width: 96px;
  }
  .order-more-menu.open { display: block; }
  .order-more-menu button {
    display: block; width: 100%; text-align: left; padding: 8px 10px;
    border: none; background: none; font-size: 12.5px; color: var(--gray-700);
    border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
  }
  .order-more-menu button:hover { background: var(--gray-100); }

  .pagination-bar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--gray-400);
  }
  .pagination-bar button:disabled { opacity: .45; cursor: default; }

  .order-detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1000;
    display: flex; justify-content: flex-end;
  }
  .order-detail-overlay.hidden { display: none; }
  .order-detail-panel {
    width: min(440px, 100%); height: 100%; background: var(--white);
    padding: 26px; overflow-y: auto; box-shadow: var(--shadow-lg);
  }
  .order-detail-panel h3 { margin: 4px 0 4px; font-size: 17px; }
  .order-detail-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  .order-detail-table th {
    text-align: left; color: var(--gray-400); font-weight: 600; padding: 7px 10px 7px 0;
    white-space: nowrap; vertical-align: top; width: 100px;
  }
  .order-detail-table td { padding: 7px 0; word-break: break-word; }
  .order-detail-panel h4 { margin: 20px 0 8px; font-size: 13.5px; color: var(--gray-700); }
  .order-detail-panel input[type=text], .order-detail-panel textarea {
    padding: 7px 10px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; color: var(--gray-700);
  }
  .detail-field-error { color: #dc2626; font-size: 12px; min-height: 16px; margin-top: 4px; }
  .internal-note-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .internal-note-item { background: var(--gray-100); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px; }
  .internal-note-meta { color: var(--gray-400); font-size: 11px; margin-bottom: 3px; }
  .internal-note-content { white-space: pre-wrap; word-break: break-word; color: var(--gray-900); }
  .status-history-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .status-history-item { border-left: 2px solid var(--gray-200); padding: 2px 0 2px 10px; font-size: 12.5px; }
  .status-history-main { color: var(--gray-900); }
  .status-history-action { color: var(--gray-400); font-size: 11px; }
  .status-history-meta { color: var(--gray-400); font-size: 11px; margin-top: 2px; }

  .payment-summary-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px;
    font-size: 12.5px; margin-bottom: 10px;
  }
  .payment-summary-label { color: var(--gray-400); margin-right: 6px; }
  .payment-history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .payment-history-item { border-left: 2px solid var(--gray-200); padding: 2px 0 2px 10px; font-size: 12.5px; }
  .payment-history-main { color: var(--gray-900); }
  .payment-history-meta { color: var(--gray-400); font-size: 11px; margin-top: 2px; }
  .payment-history-note { color: var(--gray-700); font-size: 11.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .payment-type-tag { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10.5px; font-weight: 700; margin-right: 4px; }
  .payment-type-tag.payment-type-receive { background: var(--green-pale); color: var(--green); }
  .payment-type-tag.payment-type-refund  { background: #fee2e2; color: #dc2626; }
  .status-badge.status-payment-unpaid   { background: var(--gray-100); color: var(--gray-700); border-color: var(--gray-200); }
  .status-badge.status-payment-partial  { background: #fef3c7; color: #b45309; border-color: #f59e0b; }
  .status-badge.status-payment-paid     { background: var(--green-pale); color: var(--green); border-color: var(--green); }
  .status-badge.status-payment-refunded { background: #fee2e2; color: #dc2626; border-color: #dc2626; }

  .logistics-history-item { border-left: 2px solid var(--gray-200); padding: 2px 0 2px 10px; font-size: 12.5px; }
  .logistics-history-main { color: var(--gray-900); }
  .logistics-history-meta { color: var(--gray-400); font-size: 11px; margin-top: 2px; }
  .logistics-history-note { color: var(--gray-700); font-size: 11.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .status-badge.status-logistics-preparing { background: var(--gray-100); color: var(--gray-700); border-color: var(--gray-200); }
  .status-badge.status-logistics-shipped   { background: #dbeafe; color: #1d4ed8; border-color: #2563eb; }
  .status-badge.status-logistics-delivered { background: var(--green-pale); color: var(--green); border-color: var(--green); }
  .status-badge.status-logistics-returned  { background: #fee2e2; color: #dc2626; border-color: #dc2626; }

  .quote-version-history-item { border-left: 2px solid var(--gray-200); padding: 2px 0 2px 10px; font-size: 12.5px; }
  .quote-version-history-main { color: var(--gray-900); font-weight: 700; }
  .quote-version-history-meta { color: var(--gray-400); font-size: 11px; margin-top: 2px; }
  .quote-version-history-note { color: var(--gray-700); font-size: 11.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .quote-version-history-block { color: var(--gray-700); font-size: 11.5px; margin-top: 4px; }
  .quote-version-history-block-title { color: var(--gray-400); font-size: 10.5px; margin-bottom: 1px; }
  .status-badge.status-quoteversion-valid   { background: var(--green-pale); color: var(--green); border-color: var(--green); }
  .status-badge.status-quoteversion-expired { background: #fee2e2; color: #dc2626; border-color: #dc2626; }
  .status-badge.status-quoteversion-invalid { background: #fef3c7; color: #b45309; border-color: #f59e0b; }

  /* ─── 訂單列印：#print-area 畫面上永遠隱藏，只有 @media print 生效時才顯示，
     且會把 body 底下其他所有內容一併隱藏，確保只印出這一個區塊。 ─── */
  #print-area { display: none; }
  .print-header h1 { font-size: 16px; margin: 0 0 4px; }
  .print-meta { font-size: 11px; color: #444; margin-bottom: 12px; }
  #print-area h2 { font-size: 13px; margin: 14px 0 6px; border-bottom: 1px solid #000; padding-bottom: 2px; }
  .print-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; page-break-inside: avoid; break-inside: avoid; }
  .print-table th, .print-table td { border: 1px solid #000; padding: 4px 6px; text-align: left; vertical-align: top; }
  .print-table th { width: 110px; background: #f0f0f0; font-weight: 700; white-space: nowrap; }
  .print-list-item { border: 1px solid #ccc; padding: 4px 6px; margin-bottom: 4px; font-size: 11.5px; page-break-inside: avoid; break-inside: avoid; }
  .print-list-content { white-space: pre-wrap; word-break: break-word; }
  .print-list-meta { color: #444; font-size: 10.5px; margin-top: 2px; }
  .print-empty { font-size: 11.5px; color: #666; }

  @media print {
    body * { visibility: hidden !important; }
    #print-area, #print-area * { visibility: visible !important; }
    #print-area {
      display: block !important;
      position: absolute; left: 0; top: 0; width: 100%;
      margin: 0; padding: 0;
      font-family: 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif;
      color: #000;
    }
    @page { size: A4; margin: 15mm; }
  }
</style>
</head>
<body>

<div id="gate">
  <img class="gate-bg-photo" src="/assets/gate-bg-bamboo.jpg" alt="" aria-hidden="true">
  <div id="gate-card">
    <div id="gate-band">
      <a class="gate-logo" href="https://www.yangzhu.com.tw" target="_blank" rel="noopener" aria-label="楊竹科技">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 48" width="200" height="54" aria-hidden="true">
          <text x="72" y="15"
                font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif"
                font-size="12" font-weight="400" fill="#ffffff" letter-spacing="3">楊竹科技</text>
          <text x="1" y="45"
                font-family="Georgia,'Palatino Linotype',serif"
                font-size="32" font-style="italic" font-weight="700" fill="#ffffff">YangZhu</text>
        </svg>
      </a>
    </div>
    <div id="gate-form">
      <h2>訂單管理後台</h2>
      <p>請輸入管理員帳號與密碼</p>
      <label for="gate-username" class="visually-hidden">管理員帳號</label>
      <input type="text" id="gate-username" placeholder="管理員帳號" autocomplete="username">
      <label for="gate-input" class="visually-hidden">密碼</label>
      <input type="password" id="gate-input" placeholder="密碼" autocomplete="current-password">
      <button onclick="tryLogin()">登入</button>
      <div id="gate-error"></div>
    </div>
  </div>
</div>

<div id="app" class="admin-shell" style="display:none;">
  <aside id="admin-nav"></aside>
  <div class="admin-body">
    <div id="admin-topbar" class="admin-topbar"></div>
    <main class="admin-main">

      <div class="admin-page-title">
        <div>
          <h1>訂單管理<button type="button" class="admin-help-icon" data-help-key="orders" aria-label="說明">?</button></h1>
          <p>內部使用，請勿分享此頁面連結</p>
        </div>
      </div>

      <div class="order-tabs">
        <button id="tab-btn-active" class="order-tab-btn active" onclick="switchOrderTab('active')">目前訂單</button>
        <button id="tab-btn-archived" class="order-tab-btn" onclick="switchOrderTab('archived')">已封存</button>
      </div>

      <div class="toolbar">
        <input type="search" id="search-box" placeholder="搜尋姓名 / Email / 電話 / 產品…" oninput="onFilterOrSearchChanged()">
        <label class="filter-label">開始日期
          <input type="date" id="filter-date-start" onchange="onFilterOrSearchChanged()">
        </label>
        <label class="filter-label">結束日期
          <input type="date" id="filter-date-end" onchange="onFilterOrSearchChanged()">
        </label>
        <select id="filter-product" onchange="onFilterOrSearchChanged()"><option value="">全部商品</option></select>
        <select id="filter-status" onchange="onStatusFilterChanged()"><option value="">全部狀態</option></select>
        <span id="filter-status-custom-note" class="hidden" style="font-size:12.5px;color:var(--gray-400);"></span>
        <label class="filter-label">
          <input type="checkbox" id="filter-overdue" onchange="onFilterOrSearchChanged()"> 只顯示預估逾期訂單
        </label>
        <button onclick="clearFilters()">清除篩選</button>
        <button onclick="loadOrders()">重新整理</button>
        <button class="primary" id="btn-export-orders-xlsx" onclick="exportOrdersXlsx()">匯出 Excel</button>
        <span class="stat" id="stat-text"></span>
      </div>

      <div id="table-wrap"></div>

      <div class="pagination-bar">
        <label class="filter-label">每頁筆數
          <select id="page-size-select" onchange="onPageSizeChanged()">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <span id="page-info-text"></span>
        <button id="btn-order-prev-page" onclick="changeOrderPage(-1)">上一頁</button>
        <button id="btn-order-next-page" onclick="changeOrderPage(1)">下一頁</button>
      </div>

      <p class="disclaimer">
        ・訂單列表涵蓋全部訂單（依篩選條件分頁顯示），Excel 匯出的是目前篩選結果的全部筆數，不受分頁影響。訂單狀態與「工廠包下載狀態」都存在伺服器端，任何人登入後台都會看到相同狀態。<br>
        ・訂單狀態流程：新詢價 → 已報價 → 已成交 → 生產中 → 品質檢查 → 待出貨 → 已出貨 → 已完成，一般操作只能往下一階段前進；「已取消」為例外流程，取消與狀態倒退都需要二次確認。「已完成」／「已取消」為終止狀態，如需變更請在訂單詳情頁使用「恢復訂單狀態」並二次確認。
      </p>

    </main>
  </div>
</div>

<!-- ─── 訂單詳情側邊視窗（預設隱藏）───────────── -->
<div id="order-detail-modal" class="order-detail-overlay hidden" onclick="if (event.target === this) closeOrderDetail()">
  <div class="order-detail-panel">
    <button class="btn btn-secondary btn-sm" onclick="closeOrderDetail()">關閉</button>
    <div id="order-detail-body"></div>
  </div>

<!-- ─── 列印專用區塊：畫面上永遠隱藏，只有 printOrder() 呼叫 window.print() 時
     由 CSS 的 @media print 規則暫時顯示，且會把畫面上其他所有內容一併隱藏，
     確保只印出這個區塊裡的單一訂單內容，不會印到後台導覽列/篩選器/表單/其他訂單。 -->
<div id="print-area"></div>

<!-- 訂單列「更多」選單：全表格共用同一個浮動面板，不是每列各自建立一個。
     開啟時由 toggleOrderMoreMenu() 依當次點擊的按鈕位置即時定位、填入內容。 -->
<div id="order-more-menu" class="order-more-menu" role="menu"></div>

<script src="/admin/admin-common.js"></script>
<script src="/admin/admin-nav.js"></script>
<script src="/admin/admin-tooltip.js"></script>
<script src="/js/quote-total-resolver.js"></script>
<script>
  // 正常流程（依序前進，不可跳級）：新詢價 → 已報價 → 已成交 → 生產中 → 品質檢查 → 待出貨 → 已出貨 → 已完成
  // 「已取消」是例外流程，可以從任何非終止狀態直接取消；「已完成」／「已取消」是終止狀態，
  // 一般狀態更新無法變更，只能透過訂單詳情頁的「恢復訂單狀態」並二次確認後才能變更。
  // 這份清單與規則要跟 server.js 的 ORDER_STATUS_FLOW／evaluateStatusTransition() 完全對應，
  // 但後端一律會獨立重新驗證，前端這裡只是提供正確的操作選項、避免使用者選到不合法的跳級。
  const ORDER_STATUS_FLOW = ['new_inquiry', 'quoted', 'closed_won', 'in_production', 'qc', 'ready_to_ship', 'shipped', 'completed'];
  const ORDER_STATUS_OPTIONS = [...ORDER_STATUS_FLOW, 'cancelled'];
  const TERMINAL_STATUSES = ['completed', 'cancelled'];
  const ORDER_STATUS_LABELS = {
    new_inquiry: '新詢價', quoted: '已報價', closed_won: '已成交',
    in_production: '生產中', qc: '品質檢查', ready_to_ship: '待出貨', shipped: '已出貨',
    completed: '已完成', cancelled: '已取消'
  };
  let orders = [];
  let currentPage = 1;
  let pageSize = 20;
  // 「發布新報價版本」表單的預設有效天數（系統設定第一批）：從GET /api/admin/quote-defaults
  // 讀取，四個角色都能讀（跟能發布報價版本的角色一致，見admin-rbac.js的quote_defaults說明）。
  // 讀取失敗時安全退回30天（原本寫死的預設值），不影響訂單詳情頁其他功能正常使用。
  let systemDefaultQuoteValidDays = 30;
  async function loadSystemDefaultQuoteValidDays() {
    try {
      const resp = await adminFetch('/api/admin/quote-defaults');
      const data = await resp.json().catch(() => null);
      if (resp.ok && data && typeof data.defaultValidDays === 'number' && Number.isInteger(data.defaultValidDays)) {
        systemDefaultQuoteValidDays = data.defaultValidDays;
      }
    } catch (e) {
      // 靜默失敗、維持30天預設值，不影響頁面其他功能
    }
  }

  // 手動登入（tryLogin）與已有Session自動登入（init）共用的初始化步驟：訂單清單與報價
  // 預設天數各自獨立、互不依賴，用 Promise.all 併行載入即可，不需要排隊等待；兩者各自內部
  // 都有 try/catch，fetchOrders() 失敗時回傳 false（不拋例外），
  // loadSystemDefaultQuoteValidDays() 失敗時靜默保留現有值（同樣不拋例外），Promise.all()
  // 不會因為其中一個失敗就連帶讓另一個的結果遺失。呼叫端必須 await 這支函式完整結束後，
  // 才能呼叫 showAdminApp()（進而觸發 maybeOpenOrderFromQuery() 可能立即開啟訂單詳情面板），
  // 確保 systemDefaultQuoteValidDays 在任何「發布新報價版本」表單第一次被畫出來之前，
  // 就已經是資料庫實際設定值（或安全退回的30天），不會出現先顯示30、稍後才悄悄變成
  // 正確數字的畫面閃動，也不會出現深連結（?order=）直接開啟的詳情面板用到還沒更新的舊值。
  async function prepareAdminAppData() {
    const [ordersOk] = await Promise.all([
      fetchOrders(),
      loadSystemDefaultQuoteValidDays()
    ]);
    return ordersOk;
  }
  // 主要訂單表排序狀態：sortKey為null代表維持後端原始順序（沒有套用排序）。跟currentPage／
  // pageSize一樣是模組層級變數，loadOrders()重新抓資料後不會被重置，天然保留使用者目前的
  // 排序選擇（2026-08-21 Codex獨立檢測要求）。
  const orderSortState = { sortKey: null, sortDir: 'asc' };
  // 狀態排序依業務流程順序（新詢價→已報價→…→已完成，取消排最後），不是依字母或代碼排序，
  // 這樣「依狀態排序」才有實際意義；用index()查表比在compare函式裡每次重算indexOf快。
  const ORDER_STATUS_SORT_INDEX = {};
  ORDER_STATUS_OPTIONS.forEach((s, i) => { ORDER_STATUS_SORT_INDEX[s] = i; });
  // 'active'＝目前訂單頁籤（預設，只回傳未封存訂單）；'archived'＝已封存頁籤（帶 archived=1）。
  // 兩個頁籤各自呼叫一次 /api/orders，orders 陣列永遠只代表「目前頁籤」的資料，不會混在一起。
  let currentTab = 'active';

  // ── 儀表板可點擊統計卡帶入的網址篩選參數（?product=／?statuses=／?dateStart=／?dateEnd=／
  // ?overdue=1）：product／dateStart／dateEnd 直接寫入既有的篩選欄位（完全重用既有篩選邏輯，
  // 篩選控制項本身就是目前條件的畫面呈現，不需要另外維護一份狀態）。statuses 是逗號分隔的
  // 狀態白名單，跟儀表板「待處理」「製作中」兩張卡片對應的固定狀態組合完全一致時，直接對應到
  // filter-status 下拉選單新增的兩個群組選項（一樣是既有篩選欄位的畫面呈現）；其他任意狀態組合
  // （目前沒有卡片會產生，但保留給未來擴充或直接手動輸入網址的情況）才使用這個獨立變數＋
  // 唯讀文字提示來呈現，因為單選下拉選單本身沒辦法同時勾選任意多個選項。
  let customStatusesFilter = null; // null＝沒有套用；否則是狀態代碼陣列

  // 預估逾期訂單的判斷規則，必須跟後端 admin-routes.js 的 GET /dashboard 完全一致：
  // 只有「已成交、還在履約流程中、尚未出貨」（PRODUCTION_STATUSES）的訂單才可能逾期；
  // savedAt 換算成台北日期後加上 leadDays 個日曆天，以那天台北時間 23:59:59.999 為預估期限，
  // 超過這個瞬間才算逾期；leadDays 不是「型別為 number、有限、整數、且 >= 0」一律不猜測、
  // 不計入逾期。時區固定用 UTC+8 位移換算，不依賴使用者瀏覽器系統時區設定。
  const PENDING_STATUSES = ['new_inquiry', 'quoted'];
  const PRODUCTION_STATUSES = ['closed_won', 'in_production', 'qc', 'ready_to_ship'];
  const TAIPEI_OFFSET_MS = 8 * 60 * 60 * 1000;
  function toTaipeiDateParts(isoString) {
    if (typeof isoString !== 'string' || !isoString) return null;
    const d = new Date(isoString);
    if (Number.isNaN(d.getTime())) return null;
    const taipei = new Date(d.getTime() + TAIPEI_OFFSET_MS);
    return { y: taipei.getUTCFullYear(), m: taipei.getUTCMonth(), d: taipei.getUTCDate() };
  }
  function taipeiMidnightUtcMs(parts) {
    return Date.UTC(parts.y, parts.m, parts.d, 0, 0, 0, 0) - TAIPEI_OFFSET_MS;
  }
  function isOrderOverdue(o) {
    const status = orderStatus(o);
    if (!PRODUCTION_STATUSES.includes(status)) return false;
    const parts = toTaipeiDateParts(o.savedAt);
    if (!parts) return false;
    const leadDays = o.quote?.leadDays;
    const leadDaysValid = typeof leadDays === 'number' && Number.isFinite(leadDays) && Number.isInteger(leadDays) && leadDays >= 0;
    if (!leadDaysValid) return false;
    const deadlineMs = taipeiMidnightUtcMs(parts) + leadDays * 86400000 + 86399999;
    return Date.now() > deadlineMs;
  }

  // YYYY-MM-DD 格式且必須是真實存在的日期（用 Date 建構後讀回年/月/日比對，「不存在的日期」
  // 會被自動進位到下個月，讀回來的值就會跟輸入不一致，藉此擋下，不是只檢查字串格式）。
  function isValidCalendarDateString(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
  }

  function isOrderArchived(o) {
    return !!o.archivedAt;
  }

  function orderStatus(o) {
    return o.status || (o.processed ? 'closed_won' : 'new_inquiry');
  }

  // 依目前狀態算出「合法的下一步選項」：正常操作只有一個（流程中的下一階段）；
  // 倒退（回到更早的階段）與取消都算例外操作，回傳時標記 kind 讓畫面能分開顯示、並在
  // 送出前要求二次確認。終止狀態（已完成／已取消）沒有任何一般操作可選，只能用「恢復」功能。
  function legalNextStatuses(current) {
    if (TERMINAL_STATUSES.includes(current)) return [];
    const idx = ORDER_STATUS_FLOW.indexOf(current);
    if (idx === -1) return [{ status: 'cancelled', kind: 'cancel' }];
    const options = [];
    if (idx + 1 < ORDER_STATUS_FLOW.length) {
      options.push({ status: ORDER_STATUS_FLOW[idx + 1], kind: 'forward' });
    }
    for (let i = 0; i < idx; i++) {
      options.push({ status: ORDER_STATUS_FLOW[i], kind: 'regress' });
    }
    options.push({ status: 'cancelled', kind: 'cancel' });
    return options;
  }

  function showAdminApp() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAdminNav('orders');
    renderAdminTopbar();
    populateStatusFilterOptions();
    populateProductFilterOptions();
    applyFiltersFromUrl();
    renderTable();
    maybeOpenOrderFromQuery();
  }

  // 深連結支援：網址帶 ?order=訂單編號 時（例如從客戶管理頁的歷史訂單點過來），自動開啟
  // 該筆訂單既有的詳情面板。先在目前頁籤（預設「目前訂單」）找，找不到就自動切到「已封存」
  // 頁籤再找一次（涵蓋該筆訂單其實已被封存的情況）；兩邊都找不到就靜默放棄，不用跳錯誤訊息
  // 打擾使用者（可能是訂單編號打錯或訂單已經被刪除的極端情況）。只在成功開啟登入畫面
  // （showAdminApp）之後執行一次，不影響一般直接打開 /admin 網址（沒有這個參數）的既有行為。
  async function maybeOpenOrderFromQuery() {
    const targetOrderId = new URLSearchParams(location.search).get('order');
    if (!targetOrderId) return;
    if (orders.some(o => o.orderId === targetOrderId)) {
      openOrderDetail(targetOrderId);
      return;
    }
    if (currentTab !== 'archived') {
      await switchOrderTab('archived');
      if (orders.some(o => o.orderId === targetOrderId)) {
        openOrderDetail(targetOrderId);
      }
    }
  }

  // 狀態篩選選項固定沿用 ORDER_STATUS_OPTIONS／ORDER_STATUS_LABELS，跟狀態下拉選單
  // 是同一份資料來源，不會各寫一次而以後改一邊漏改另一邊。額外新增兩個「群組」選項，
  // 對應儀表板「待處理」「製作中」兩張統計卡點擊後帶入的多狀態篩選（?statuses=...）——
  // 這樣單選下拉選單本身就能完整呈現這兩種多狀態篩選條件目前是否套用中，不需要另外
  // 設計多選介面。
  const STATUS_GROUP_PENDING = '__pending__';
  const STATUS_GROUP_PRODUCTION = '__production__';
  function populateStatusFilterOptions() {
    const select = document.getElementById('filter-status');
    if (!select) return;
    select.innerHTML = '<option value="">全部狀態</option>'
      + `<option value="${STATUS_GROUP_PENDING}">待處理（新詢價＋已報價）</option>`
      + `<option value="${STATUS_GROUP_PRODUCTION}">製作中（已成交＋生產中＋品質檢查＋待出貨）</option>`
      + ORDER_STATUS_OPTIONS.map(s => `<option value="${s}">${ORDER_STATUS_LABELS[s]}</option>`).join('');
  }

  // 商品名稱正規化規則，必須跟後端 admin-routes.js 的 normalizeProductName() 完全一致：
  // product.name 必須是字串、trim() 後不可為空白，合法名稱一律用 trim() 後的名稱；缺少／
  // null／非字串／空字串／只有空白，統一轉成固定文字「未知商品」。儀表板「熱門商品排行」
  // 用的就是這條規則分組，點擊排行連結後帶到這個頁面的 ?product= 也是同一個字串，兩邊
  // 用來比對的商品名稱完全一致，才不會出現「排行顯示1筆、點擊後篩選卻是0筆」的落差。
  function normalizeProductName(name) {
    if (typeof name !== 'string') return '未知商品';
    const trimmed = name.trim();
    return trimmed ? trimmed : '未知商品';
  }

  // 商品篩選選項依目前訂單資料自動產生並去除重複（用正規化後的名稱分組，缺少商品名稱的
  // 訂單會產生「未知商品」這個選項，而不是被直接濾掉）；每次重新整理訂單清單都要重新產生
  // 一次（新訂單可能帶入新的產品名稱），保留使用者原本選取的商品（若還存在於新清單中）。
  function populateProductFilterOptions() {
    const select = document.getElementById('filter-product');
    if (!select) return;
    const previousValue = select.value;
    const names = Array.from(new Set(orders.map(o => normalizeProductName(o.product?.name))))
      .sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    select.innerHTML = '<option value="">全部商品</option>'
      + names.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
    if (previousValue && names.includes(previousValue)) select.value = previousValue;
  }

  // 讀取儀表板可點擊統計卡帶入的網址篩選參數，套用到既有篩選欄位（篩選控制項本身就是
  // 目前條件的畫面呈現，重新整理頁面時網址參數還在，篩選條件也會跟著保留）。不合法的
  // 日期、未知狀態或其他錯誤參數一律安全忽略，不猜測、不拋出例外、不影響頁面其餘功能。
  function applyFiltersFromUrl() {
    const params = new URLSearchParams(location.search);

    const productParam = params.get('product');
    if (productParam) {
      const select = document.getElementById('filter-product');
      select.value = productParam;
      // 目前訂單清單裡剛好沒有任何一筆是這個商品名稱時，下拉選單不會有對應的
      // <option>，直接設值會被瀏覽器忽略、視覺上退回「全部商品」——這裡額外補一個
      // 選項，確保篩選條件仍然正確套用、畫面上也看得到目前是哪個商品名稱。
      if (select.value !== productParam) {
        const opt = document.createElement('option');
        opt.value = productParam;
        opt.textContent = productParam;
        select.appendChild(opt);
        select.value = productParam;
      }
    }

    const dateStartParam = params.get('dateStart');
    if (dateStartParam && isValidCalendarDateString(dateStartParam)) {
      document.getElementById('filter-date-start').value = dateStartParam;
    }
    const dateEndParam = params.get('dateEnd');
    if (dateEndParam && isValidCalendarDateString(dateEndParam)) {
      document.getElementById('filter-date-end').value = dateEndParam;
    }

    const statusesParam = params.get('statuses');
    if (statusesParam) {
      const requested = statusesParam.split(',').map(s => s.trim()).filter(Boolean);
      const valid = requested.filter(s => ORDER_STATUS_OPTIONS.includes(s));
      const uniqueValid = [...new Set(valid)];
      if (uniqueValid.length === 1) {
        document.getElementById('filter-status').value = uniqueValid[0];
      } else if (uniqueValid.length > 1) {
        const sameAsPending = uniqueValid.length === PENDING_STATUSES.length && PENDING_STATUSES.every(s => uniqueValid.includes(s));
        const sameAsProduction = uniqueValid.length === PRODUCTION_STATUSES.length && PRODUCTION_STATUSES.every(s => uniqueValid.includes(s));
        if (sameAsPending) {
          document.getElementById('filter-status').value = STATUS_GROUP_PENDING;
        } else if (sameAsProduction) {
          document.getElementById('filter-status').value = STATUS_GROUP_PRODUCTION;
        } else {
          // 選單本身沒有對應的固定選項可以呈現這個任意組合，改用獨立變數＋唯讀文字
          // 提示畫面上目前實際套用的狀態條件。
          customStatusesFilter = uniqueValid;
          const noteEl = document.getElementById('filter-status-custom-note');
          noteEl.textContent = '網址篩選狀態：' + uniqueValid.map(s => ORDER_STATUS_LABELS[s]).join('、');
          noteEl.classList.remove('hidden');
        }
      }
      // uniqueValid.length === 0（全部都是未知或非法狀態代碼）：安全忽略，不套用任何狀態篩選。
    }

    if (params.get('overdue') === '1') {
      document.getElementById('filter-overdue').checked = true;
    }
  }

  // 登入／登出改用 後台系統/admin-common.js 提供的 adminLogin()／adminLogout()（Cookie
  // Session＋CSRF Token，密碼只在這次登入請求中送出，不會被保存在 localStorage 或任何地方）。
  async function tryLogin() {
    const usernameInput = document.getElementById('gate-username');
    const input = document.getElementById('gate-input');
    const errEl = document.getElementById('gate-error');
    const username = usernameInput.value.trim();
    const password = input.value;
    if (!username || !password) return;
    errEl.textContent = '登入中…';
    const result = await adminLogin(username, password);
    input.value = ''; // 不論成功或失敗，欄位裡的密碼都不保留
    if (result.ok) {
      const ok = await prepareAdminAppData();
      if (ok) {
        showAdminApp();
      } else {
        errEl.textContent = '訂單資料載入失敗，請稍後再試';
      }
    } else {
      errEl.textContent = result.error || '登入失敗';
    }
  }

  function logout() {
    adminLogout();
  }

  async function fetchOrders() {
    try {
      const url = currentTab === 'archived' ? '/api/orders?archived=1' : '/api/orders';
      const resp = await adminFetch(url);
      if (!resp.ok) return false;
      const data = await resp.json();
      orders = data.orders || [];
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function loadOrders() {
    const ok = await fetchOrders();
    if (!ok) { logout(); return; }
    populateProductFilterOptions(); // 重新整理可能帶回新產品，商品篩選選項要跟著更新
    renderTable();
  }

  // 切換「目前訂單／已封存」頁籤：重新向對應的 archived 參數打一次 /api/orders，
  // 不在前端自己用同一份清單做過濾（後端本來就已經分開回傳，前端沒必要重複這份邏輯）。
  async function switchOrderTab(tab) {
    if (tab === currentTab) return;
    currentTab = tab;
    currentPage = 1;
    document.getElementById('tab-btn-active').classList.toggle('active', tab === 'active');
    document.getElementById('tab-btn-archived').classList.toggle('active', tab === 'archived');
    await loadOrders();
  }

  // 空值／不合法的時間字串一律顯示「--」，不可以顯示 new Date(undefined) 產生的
  // 「Invalid Date」字樣（toLocaleString() 對 Invalid Date 不會拋例外、只會回傳
  // 這個看起來像錯誤訊息的字串，光靠 try/catch 接不住，必須明確檢查 getTime()）。
  function fmtTime(iso) {
    if (!iso) return '--';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '--';
    return d.toLocaleString('zh-TW', { hour12: false });
  }

  // 金額／數量欄位同樣要對缺漏或非數字值安全處理，不能顯示 "NT$ undefined" 之類的字串。
  function fmtMoney(n) {
    return (typeof n === 'number' && Number.isFinite(n)) ? `NT$ ${n.toLocaleString()}` : '--';
  }
  function fmtQty(n) {
    return (typeof n === 'number' && Number.isFinite(n)) ? n.toLocaleString() : '--';
  }

  // 訂單時間一律讀 savedAt；舊訂單資料可能缺這個欄位或格式不合法，一律回傳 null
  // 而不是讓 new Date(undefined) 產生的 Invalid Date 混進比較，也不會拋出例外。
  function orderDateValue(o) {
    const raw = o?.savedAt;
    if (!raw) return null;
    const d = new Date(raw);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  // <input type="date"> 給的是 YYYY-MM-DD 字串；直接丟給 new Date() 會被解讀成 UTC 午夜，
  // 在台灣時區（UTC+8）會整個往前偏移將近一天，讓「今天」篩選不到今天的訂單。這裡改成
  // 自己拆年月日組出「本地時區」的 Date，開始日固定當天 00:00:00.000，結束日固定當天
  // 23:59:59.999，確保結束日當天晚上（甚至最後一毫秒）的訂單都不會被日期篩選漏掉。
  function parseFilterDateStart(s) {
    if (!s) return null;
    const [y, m, d] = s.split('-').map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d, 0, 0, 0, 0);
  }
  function parseFilterDateEnd(s) {
    if (!s) return null;
    const [y, m, d] = s.split('-').map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d, 23, 59, 59, 999);
  }

  // 關鍵字搜尋、日期區間、商品、狀態、預估逾期五個條件必須同時成立（AND），renderTable() 跟
  // exportOrdersXlsx() 共用同一份邏輯，才不會出現「畫面篩選結果」跟「匯出內容」兜不起來的情況。
  function getFilteredOrders() {
    const q = (document.getElementById('search-box')?.value || '').trim().toLowerCase();
    const dateStart = parseFilterDateStart(document.getElementById('filter-date-start')?.value || '');
    const dateEnd = parseFilterDateEnd(document.getElementById('filter-date-end')?.value || '');
    const productFilter = document.getElementById('filter-product')?.value || '';
    const statusFilterRaw = document.getElementById('filter-status')?.value || '';
    const overdueOnly = !!document.getElementById('filter-overdue')?.checked;

    // 狀態篩選白名單：優先看 filter-status 下拉選單目前選到的值（含兩個群組選項），
    // 只有選單本身無法表達的任意多狀態組合，才退回使用 customStatusesFilter。
    let statusWhitelist = null;
    if (statusFilterRaw === STATUS_GROUP_PENDING) statusWhitelist = PENDING_STATUSES;
    else if (statusFilterRaw === STATUS_GROUP_PRODUCTION) statusWhitelist = PRODUCTION_STATUSES;
    else if (statusFilterRaw) statusWhitelist = [statusFilterRaw];
    else if (customStatusesFilter) statusWhitelist = customStatusesFilter;

    return orders.filter(o => {
      if (q) {
        const hay = [o.friendlyOrderNo, o.contact?.name, o.contact?.email, o.contact?.phone, o.product?.name, o.contact?.note, ORDER_STATUS_LABELS[orderStatus(o)]]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (dateStart || dateEnd) {
        const od = orderDateValue(o);
        if (!od) return false; // 有設定日期篩選、但這筆訂單沒有可用時間可比對時安全排除，不猜測、不拋錯
        if (dateStart && od < dateStart) return false;
        if (dateEnd && od > dateEnd) return false;
      }
      if (productFilter && normalizeProductName(o.product?.name) !== productFilter) return false;
      if (statusWhitelist && !statusWhitelist.includes(orderStatus(o))) return false;
      if (overdueOnly && !isOrderOverdue(o)) return false;
      return true;
    });
  }

  function clearFilters() {
    document.getElementById('search-box').value = '';
    document.getElementById('filter-date-start').value = '';
    document.getElementById('filter-date-end').value = '';
    document.getElementById('filter-product').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-overdue').checked = false;
    customStatusesFilter = null;
    const noteEl = document.getElementById('filter-status-custom-note');
    noteEl.textContent = '';
    noteEl.classList.add('hidden');
    // 清除篩選也要清除網址上的篩選參數，避免使用者重新整理頁面時，網址殘留的舊參數
    // 又把剛剛清掉的篩選條件重新套用回來。
    if (location.search) history.replaceState(null, '', location.pathname);
    onFilterOrSearchChanged();
  }

  // 篩選／搜尋條件一改變，結果集合就可能整個不一樣，停在原本的頁碼很容易停在一個
  // 已經沒有資料的空頁面；統一由這支函式處理「條件變了 → 回到第 1 頁」。
  function onFilterOrSearchChanged() {
    currentPage = 1;
    renderTable();
  }

  // 使用者手動改變狀態下拉選單時，代表使用者要自己直接指定狀態條件，任何來自網址
  // 「任意多狀態組合」的殘留篩選（customStatusesFilter／唯讀提示文字）都要跟著清掉，
  // 避免選單顯示「全部狀態」卻仍套用著使用者已經看不到、無法理解的舊篩選條件。
  function onStatusFilterChanged() {
    customStatusesFilter = null;
    const noteEl = document.getElementById('filter-status-custom-note');
    noteEl.textContent = '';
    noteEl.classList.add('hidden');
    onFilterOrSearchChanged();
  }

  function onPageSizeChanged() {
    pageSize = Number(document.getElementById('page-size-select').value) || 20;
    currentPage = 1;
    renderTable();
  }

  function changeOrderPage(delta) {
    currentPage = Math.max(1, currentPage + delta);
    renderTable();
  }

  // 排序鍵對應的實際取值方式；時間／數量／金額轉成數字或毫秒時間戳給adminCompareForSort()
  // 做數值比較，狀態轉成業務流程順序索引，其餘（訂單編號、客戶）用字串比較。
  function orderSortValue(o, key) {
    switch (key) {
      case 'friendlyOrderNo': return o.friendlyOrderNo || o.orderId || '';
      case 'savedAt': { const d = orderDateValue(o); return d ? d.getTime() : null; }
      case 'contactName': return o.contact?.name || '';
      case 'qty': return (typeof o.product?.qty === 'number' && Number.isFinite(o.product.qty)) ? o.product.qty : null;
      case 'total': return (typeof o.quote?.total === 'number' && Number.isFinite(o.quote.total)) ? o.quote.total : null;
      case 'statusIndex': { const idx = ORDER_STATUS_SORT_INDEX[orderStatus(o)]; return typeof idx === 'number' ? idx : null; }
      default: return null;
    }
  }

  function renderTable() {
    // 這個表格每次renderTable()都會把整個thead＋tbody一起透過innerHTML重建（不像其他頁面
    // 只換tbody、thead維持不變），排序按鈕本身也會跟著被整批換成全新的DOM節點。如果使用者
    // 是用鍵盤（Tab／Enter／Space）操作排序按鈕，重建後新按鈕不會自動接手焦點，鍵盤使用者會
    // 「失去所在位置」；這裡記錄「重建前，目前的排序按鈕是不是使用者正在操作的那個」，重建
    // 完成後把焦點還給新按鈕的同一個位置，維持鍵盤操作的連續性。
    const activeSortKeyForFocus = (document.activeElement && document.activeElement.closest && document.activeElement.closest('th[data-sort-key]'))
      ? document.activeElement.closest('th[data-sort-key]').dataset.sortKey
      : null;

    // 處理順序固定是「篩選→排序→分頁」：先篩選出符合條件的訂單，再依目前排序狀態排序，
    // 最後才依頁碼切出這一頁要顯示的資料——順序顛倒（例如先分頁再排序）會讓排序只在
    // 「這一頁裡面」生效，不是整個篩選結果的正確排序，是2026-08-21 Codex獨立檢測明確要求的處理順序。
    const filtered = getFilteredOrders();
    if (orderSortState.sortKey) {
      filtered.sort((a, b) => adminCompareForSort(orderSortValue(a, orderSortState.sortKey), orderSortValue(b, orderSortState.sortKey), orderSortState.sortDir));
    }

    document.getElementById('stat-text').textContent = `共 ${orders.length} 筆（篩選後 ${filtered.length} 筆）`;

    // 分頁永遠對「篩選後（且已排序）」的完整結果做（不是只對目前這一頁再篩一次），totalPages
    // 至少為 1，篩選或排序讓目前頁碼超出範圍時（例如原本停在第 3 頁、篩選後只剩 1 頁）要
    // 夾回合法範圍，維持「合法頁碼」。
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const pageStart = (currentPage - 1) * pageSize;
    const pageItems = filtered.slice(pageStart, pageStart + pageSize);

    document.getElementById('page-info-text').textContent = filtered.length
      ? `第 ${currentPage} / ${totalPages} 頁`
      : '';
    document.getElementById('btn-order-prev-page').disabled = currentPage <= 1;
    document.getElementById('btn-order-next-page').disabled = currentPage >= totalPages;

    const wrap = document.getElementById('table-wrap');
    if (!filtered.length) {
      wrap.innerHTML = '<div class="empty">沒有符合篩選條件的訂單，請調整條件或按「清除篩選」</div>';
      return;
    }

    wrap.innerHTML = `
      <div class="admin-table-wrap">
      <table>
        <thead id="order-table-thead">
          <tr>
            <th data-sort-key="friendlyOrderNo">訂單編號</th><th data-sort-key="savedAt">時間</th><th data-sort-key="contactName">客戶</th><th>聯絡方式</th><th>產品</th>
            <th data-sort-key="qty">數量</th><th data-sort-key="total">預估總額</th><th>備註</th><th data-sort-key="statusIndex">狀態</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${pageItems.map(o => {
            const status = orderStatus(o);
            const factoryDownloaded = !!o.factoryPackageDownloadedAt;
            const factoryBadge = factoryDownloaded
              ? `<span class="factory-badge done" title="${fmtTime(o.factoryPackageDownloadedAt)}">已下載</span>`
              : `<span class="factory-badge pending">尚未下載</span>`;
            const isArchivedRow = currentTab === 'archived';
            return `
            <tr>
              <td class="order-no">${escHtml(o.friendlyOrderNo || '--')}</td>
              <td>${fmtTime(o.savedAt)}</td>
              <td>${escHtml(o.contact?.name || '--')}</td>
              <td>${escHtml(o.contact?.email || '--')}<br>${escHtml(o.contact?.phone || '')}</td>
              <td>${escHtml(o.product?.name || '--')}<br><span class="stat">${escHtml(o.product?.material || '')} / ${escHtml(o.product?.finish || '')}</span></td>
              <td class="qty">${fmtQty(o.product?.qty)}</td>
              <td class="price">${fmtMoney(o.quote?.total)}</td>
              <td class="note">${escHtml(o.contact?.note || '')}</td>
              <td>${renderStatusCell(o)}</td>
              <td class="order-actions-cell">
                <div class="order-actions-row">
                  <button class="order-status-btn" onclick="openOrderDetail('${o.orderId}')">查看詳情</button>
                  <button type="button" class="order-status-btn" onclick="toggleOrderMoreMenu(event, '${o.orderId}', ${isArchivedRow})">更多 ▾</button>
                </div>
                <div class="order-actions-row">
                  <button class="order-status-btn factory" onclick="downloadFactoryPackage('${o.orderId}', this)">下載工廠包</button>
                  ${factoryBadge}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    `;
    // thead整段跟著wrap.innerHTML一起重建（表格內容本身就是每次重繪整個換掉，不是只換
    // tbody），所以排序表頭的互動也要在這裡重新綁定一次；attachAdminSortableHeaders()是
    // 操作全新的DOM節點，不會有事件監聽器重複累加或記憶體洩漏的問題。
    attachAdminSortableHeaders(document.getElementById('order-table-thead'), orderSortState, () => renderTable());

    if (activeSortKeyForFocus) {
      const newBtn = document.querySelector(`#order-table-thead th[data-sort-key="${activeSortKeyForFocus}"] button`);
      if (newBtn) newBtn.focus();
    }
  }

  // 終止狀態（已完成／已取消）只顯示清楚標示的徽章，不提供一般狀態下拉選單——
  // 一般狀態變更的下拉選項只列出「合法的下一步」（下一階段／倒退／取消），使用者不可能
  // 在畫面上選到不合法的跳級；後端仍會用同一套規則獨立重新驗證，不只依賴這裡的篩選。
  function renderStatusCell(o) {
    const status = orderStatus(o);
    // 已封存訂單一律唯讀顯示徽章，不提供下拉選單（不論狀態本身是否為終止狀態）。
    if (isOrderArchived(o)) {
      return `<span class="status-badge status-terminal status-${status}">${escHtml(ORDER_STATUS_LABELS[status])}</span>`;
    }
    if (TERMINAL_STATUSES.includes(status)) {
      return `<span class="status-badge status-terminal status-${status}">${escHtml(ORDER_STATUS_LABELS[status])}（終止）</span>`;
    }
    const opts = legalNextStatuses(status);
    const forwardOpt  = opts.find(x => x.kind === 'forward');
    const regressOpts = opts.filter(x => x.kind === 'regress');
    const hasCancel   = opts.some(x => x.kind === 'cancel');
    // 選單收合時看到的文字＝目前選到的option文字，「（目前）」是多餘的（本來就是選到的那個），
    // 拿掉能讓縮合狀態的欄位變窄；展開選單裡的「下一步」「倒退狀態」等其他選項不受影響，
    // 一樣清楚標示。
    let optionsHtml = `<option value="${status}" selected>${escHtml(ORDER_STATUS_LABELS[status])}</option>`;
    if (forwardOpt) {
      optionsHtml += `<option value="${forwardOpt.status}">下一步：${escHtml(ORDER_STATUS_LABELS[forwardOpt.status])}</option>`;
    }
    if (regressOpts.length) {
      optionsHtml += `<optgroup label="倒退狀態（需二次確認）">`
        + regressOpts.map(x => `<option value="${x.status}">${escHtml(ORDER_STATUS_LABELS[x.status])}</option>`).join('')
        + `</optgroup>`;
    }
    if (hasCancel) {
      optionsHtml += `<option value="cancelled">取消訂單（需二次確認）</option>`;
    }
    return `<select class="status-select status-${status}" onchange="updateOrderStatus('${o.orderId}', this)">${optionsHtml}</select>`;
  }

  // ─── 訂單列「更多」選單（列印／封存／還原）────────────────
  // 表格每一列的「操作」欄原本把查看詳情／列印／封存／下載工廠包五個項目直排、中間用兩個
  // <br>隔開，列高被撐得很高；改成只留最常用的「查看詳情」「下載工廠包」在外面，「列印」
  // 「封存（或還原）」收進「更多」選單。選單只用一個共用的浮動面板（不是每列各自建立一個
  // DOM），開啟時才依按鈕當下位置定位、填入內容，關閉時清空——這樣不管表格有幾百列，
  // 同時間DOM裡最多只有一個選單，效能跟先前的說明提示元件（admin-tooltip.js）是同一套思路。
  function closeOrderMoreMenu() {
    const menu = document.getElementById('order-more-menu');
    menu.classList.remove('open');
    menu.innerHTML = '';
  }

  function positionOrderMoreMenu(btn, menu) {
    const rect = btn.getBoundingClientRect();
    const margin = 8;
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    // 靠右對齊按鈕右緣、往下展開；「操作」欄是表格最後一欄，靠右對齊能讓選單往表格內部展開，
    // 不會超出畫面右側。下方空間不夠時改往上展開。
    let left = rect.right - mw;
    let top = rect.bottom + 4;
    if (left < margin) left = margin;
    if (left + mw > window.innerWidth - margin) left = window.innerWidth - margin - mw;
    if (top + mh > window.innerHeight - margin) top = rect.top - mh - 4;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  function toggleOrderMoreMenu(event, orderId, isArchived) {
    event.stopPropagation();
    const menu = document.getElementById('order-more-menu');
    const btn = event.currentTarget;
    const alreadyOpenForThisRow = menu.classList.contains('open') && menu.dataset.orderId === orderId;
    closeOrderMoreMenu();
    if (alreadyOpenForThisRow) return; // 再點一次同一列的「更多」＝關閉

    menu.innerHTML = isArchived
      ? `<button type="button" onclick="closeOrderMoreMenu(); unarchiveOrderRow('${orderId}', this)">還原</button>`
      : `<button type="button" onclick="closeOrderMoreMenu(); printOrder('${orderId}')">列印</button>
         <button type="button" onclick="closeOrderMoreMenu(); archiveOrderRow('${orderId}', this)">封存</button>`;
    menu.dataset.orderId = orderId;
    // 量測尺寸前先用visibility:hidden展開，避免使用者看到「先出現在左上角、再跳到正確位置」的閃爍。
    menu.style.visibility = 'hidden';
    menu.classList.add('open');
    positionOrderMoreMenu(btn, menu);
    menu.style.visibility = '';
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#order-more-menu') && !e.target.closest('.order-actions-cell')) closeOrderMoreMenu();
  });
  window.addEventListener('scroll', () => {
    const menu = document.getElementById('order-more-menu');
    if (menu.classList.contains('open')) closeOrderMoreMenu();
  }, true);

  // 滑鼠移開「更多」按鈕或選單本身一小段時間後自動關閉（給使用者足夠時間把滑鼠從按鈕移到
  // 選單裡點選項目，不會滑鼠一離開按鈕就立刻消失）。用pointerover／pointerout並限定
  // pointerType==='mouse'，不是mouseover／mouseout——原因跟admin-tooltip.js的說明提示元件
  // 完全一樣：觸控裝置點按鈕時，瀏覽器也會補發一組合成的滑鼠事件，如果hover關閉邏輯照單
  // 全收，會跟click切換開關的邏輯互相打架，導致觸控點開選單後又被自己觸發的滑鼠事件關掉。
  let orderMoreMenuHideTimer = null;
  function isInOrderMoreMenuArea(el) {
    return !!(el && el.closest && (el.closest('#order-more-menu') || el.closest('.order-actions-cell')));
  }
  document.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const menu = document.getElementById('order-more-menu');
    if (!menu.classList.contains('open')) return;
    if (isInOrderMoreMenuArea(e.target)) clearTimeout(orderMoreMenuHideTimer);
  });
  document.addEventListener('pointerout', e => {
    if (e.pointerType !== 'mouse') return;
    const menu = document.getElementById('order-more-menu');
    if (!menu.classList.contains('open')) return;
    if (!isInOrderMoreMenuArea(e.target)) return;
    if (isInOrderMoreMenuArea(e.relatedTarget)) return; // 還在按鈕／選單範圍內移動，不算離開
    orderMoreMenuHideTimer = setTimeout(closeOrderMoreMenu, 400);
  });
  window.addEventListener('resize', closeOrderMoreMenu);

  // 狀態改成伺服器端存放（POST /api/orders/:orderId/status），所有登入後台的人看到的都是同一份狀態。
  // 前進到下一階段是「一般操作」不需要確認；取消與倒退屬於例外操作，一定會先跳二次確認對話框，
  // 使用者取消對話框則整個還原、不送出任何請求。合法性規則跟後端 evaluateStatusTransition() 一致，
  // 但實際是否放行仍完全由後端決定（confirm 旗標也是送到後端一起驗證，不是只在前端擋一下而已）。
  async function updateOrderStatus(orderId, selectEl) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const prevStatus = orderStatus(order);
    const nextStatus = selectEl.value;
    if (nextStatus === prevStatus) return;

    const fromIdx = ORDER_STATUS_FLOW.indexOf(prevStatus);
    const toIdx   = ORDER_STATUS_FLOW.indexOf(nextStatus);
    const isCancel  = nextStatus === 'cancelled';
    const isForward = !isCancel && toIdx === fromIdx + 1;
    const isRegress = !isCancel && !isForward && toIdx !== -1 && toIdx < fromIdx;

    // adminRunAction()包住從確認對話框開始的整個流程（不是只包fetch）：下拉選單一開始
    // 觸發就立刻進入鎖定狀態，避免快速連續觸發同一個select開出兩個確認視窗、各自確認後
    // 各送一次API的競態（2026-08-21 Codex獨立檢測發現的缺口）。
    await adminRunAction(selectEl, null, async () => {
      let confirmFlag = false;
      if (isCancel) {
        const { confirmed } = await adminConfirmDialog({
          title: '確認取消訂單',
          message: `確定要取消訂單「${order.friendlyOrderNo || orderId}」嗎？取消為例外流程，請再次確認。`,
          danger: true,
          confirmLabel: '確認取消'
        });
        if (!confirmed) { selectEl.value = prevStatus; return; } // 取消確認時完全不呼叫API，下拉選單復原成原本狀態
        confirmFlag = true;
      } else if (isRegress) {
        const { confirmed } = await adminConfirmDialog({
          title: '確認狀態倒退',
          message: `確定要將訂單「${order.friendlyOrderNo || orderId}」狀態從「${ORDER_STATUS_LABELS[prevStatus]}」倒退為「${ORDER_STATUS_LABELS[nextStatus]}」嗎？`,
          danger: true,
          confirmLabel: '確認倒退'
        });
        if (!confirmed) { selectEl.value = prevStatus; return; }
        confirmFlag = true;
      }

      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
          method: 'POST',
          body: JSON.stringify({ status: nextStatus, confirm: confirmFlag })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '狀態更新失敗');
        order.status = data.status;
        order.statusUpdatedAt = data.statusUpdatedAt;
        order.statusHistory = data.statusHistory; // 讓記憶體內的訂單資料同步最新歷程，下次開詳情頁不用重新整理頁面
        renderTable();
      } catch (e) {
        console.error(e);
        alert(e.message || '狀態更新失敗，請確認網路連線後再試一次');
        selectEl.value = prevStatus;
      }
    });
  }

  // ─── 訂單封存／還原（列表快速操作）：送出前用訂單編號做二次確認，送出期間停用按鈕，
  // 失敗時顯示錯誤並恢復可點擊、可直接重試；成功後這筆訂單就不再屬於「目前頁籤」，
  // 直接從記憶體中的 orders 移除並重繪列表（不用整批重新打 API），畫面上會立即消失，
  // 使用者切到另一個頁籤時就能看到它已經移過去了。
  async function archiveOrderRow(orderId, btnEl) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    // adminRunAction()包住整個流程（含確認對話框），按鈕從觸發當下就鎖定，避免快速連點
    // 開出兩個確認視窗、各自確認後各送一次API的競態。
    await adminRunAction(btnEl, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認封存訂單',
        message: `確定要封存訂單「${order.friendlyOrderNo || orderId}」嗎？封存後這筆訂單會移到「已封存」頁籤，需要時可再還原。`,
        confirmLabel: '確認封存'
      });
      if (!confirmed) return; // 取消確認時完全不呼叫API
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/archive`, {
          method: 'POST',
          body: JSON.stringify({ confirm: true })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '封存失敗');
        orders = orders.filter(o => o.orderId !== orderId);
        renderTable();
      } catch (e) {
        alert(e.message || '封存失敗，請確認網路連線後再試一次');
      }
    });
  }

  async function unarchiveOrderRow(orderId, btnEl) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    await adminRunAction(btnEl, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認還原訂單',
        message: `確定要還原訂單「${order.friendlyOrderNo || orderId}」嗎？還原後這筆訂單會移回「目前訂單」頁籤。`,
        confirmLabel: '確認還原'
      });
      if (!confirmed) return;
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/unarchive`, {
          method: 'POST',
          body: JSON.stringify({ confirm: true })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '還原失敗');
        orders = orders.filter(o => o.orderId !== orderId);
        renderTable();
      } catch (e) {
        alert(e.message || '還原失敗，請確認網路連線後再試一次');
      }
    });
  }

  // 工廠包下載：改用 adminFetch() 取得ZIP的Blob（不再用?token=網址參數傳送管理密碼），
  // 再用瀏覽器Object URL觸發下載，下載期間停用按鈕避免重複送出，完成或失敗都要恢復按鈕
  // 文字並revokeObjectURL釋放資源。GET請求本身不需要CSRF Token（見後端csrfProtection()對
  // GET一律放行），但仍然需要有效的登入Session Cookie才能下載，未登入會由adminFetch()的
  // 401攔截自動顯示登入畫面。
  async function downloadFactoryPackage(orderId, btnEl) {
    const originalText = btnEl.textContent;
    btnEl.disabled = true;
    btnEl.textContent = '下載中…';
    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/factory-package`);
      if (!resp.ok) {
        const data = await resp.json().catch(() => null);
        throw new Error((data && data.error) || '工廠包下載失敗');
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${orderId}_factory-package.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      scheduleFactoryStatusRefresh();
    } catch (e) {
      showAdminToast(e.message || '工廠包下載失敗', true);
    } finally {
      btnEl.disabled = false;
      btnEl.textContent = originalText;
    }
  }

  // 下載完成後延遲重新整理一次列表，讓「工廠包已下載」徽章能自動更新，不用手動按重新整理。
  function scheduleFactoryStatusRefresh() {
    setTimeout(loadOrders, 3000);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── 訂單詳情側邊視窗 ─────────────────────────
  // 訂單資料已經整批載入在 orders 裡（登入時已用有效Session驗證過），開詳情不用
  // 再打一次 API，也就不會多一個需要另外做權限檢查、或不小心把識別碼放進網址的端點。
  function openOrderDetail(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    // 訂單負責人／內部備註各自包在獨立的 <div id="..."> 裡：儲存負責人或新增備註成功後
    // 只重繪對應那一小塊，不會整個詳情面板重建，使用者在另一個欄位打到一半的字不會被清掉。
    document.getElementById('order-detail-body').innerHTML = `
      ${renderOrderDetailHtml(order)}
      <div id="order-detail-archive-section">${renderArchiveSectionHtml(order)}</div>
      <div id="order-detail-status-section">${renderStatusSectionHtml(order)}</div>
      <div id="order-detail-history-section">${renderStatusHistoryHtml(order)}</div>
      <div id="order-detail-pricing-section">${renderPricingAdjustmentSectionHtml(order)}</div>
      <div id="order-detail-quote-version-section">${renderQuoteVersionSectionHtml(order)}</div>
      <div id="order-detail-payment-section">${renderPaymentSectionHtml(order)}</div>
      <div id="order-detail-logistics-section">${renderLogisticsSectionHtml(order)}</div>
      <div id="order-detail-assignee-section">${renderAssigneeSectionHtml(order)}</div>
      <div id="order-detail-notes-section">${renderNotesSectionHtml(order)}</div>
    `;
    document.getElementById('order-detail-modal').classList.remove('hidden');
  }

  // ─── 付款資料：純顯示用的摘要計算，跟 server.js 的 computePaymentSummary() 完全同一套邏輯
  // （累計收款／累計退款／實收金額／尚欠金額／付款狀態），但這裡只是為了畫面即時呈現，
  // 真正的驗證與寫入（尤其是退款不可超過可退款餘額）一律以後端為準，前端不做任何攔截判斷。
  const PAYMENT_TYPE_LABELS = { receive: '收款', refund: '退款' };
  const PAYMENT_METHOD_LABELS = { bank_transfer: '銀行匯款', cash: '現金', card: '刷卡', other: '其他' };
  const PAYMENT_STATUS_LABELS = { unpaid: '未付款', partial: '部分付款', paid: '已付款', refunded: '已退款' };

  // ─── 付款交易冪等：同一筆使用者意圖的送出（含失敗重試、頁面重新整理）必須沿用同一組
  // idempotencyKey，避免網路中斷或使用者手動重試導致後端重複入帳。尚未確認成功的 key 與
  // 表單內容暫存在 sessionStorage（用訂單 id 分開存放），成功（含後端回報的冪等重放）才刪除，
  // 這樣即使使用者在請求送出後重新整理頁面，也不會遺失還沒確認成功的 key。
  const PAYMENT_PENDING_KEY_PREFIX = 'yz_pending_payment_';

  function paymentPendingStorageKey(orderId) {
    return PAYMENT_PENDING_KEY_PREFIX + orderId;
  }
  function loadPendingPayment(orderId) {
    try {
      const raw = sessionStorage.getItem(paymentPendingStorageKey(orderId));
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function savePendingPayment(orderId, payload) {
    try { sessionStorage.setItem(paymentPendingStorageKey(orderId), JSON.stringify(payload)); } catch {}
  }
  function clearPendingPayment(orderId) {
    try { sessionStorage.removeItem(paymentPendingStorageKey(orderId)); } catch {}
  }
  // 判斷使用者這次要送出的表單內容，是否就是上次沒送成功的那一筆——是的話重用同一組 key；
  // 使用者已經把金額／類型等改掉的話，代表是新的付款意圖，要換一組新 key，不能沿用舊的。
  function paymentPayloadsMatch(a, b) {
    return a.type === b.type && Number(a.amount) === Number(b.amount) && a.method === b.method &&
      (a.reference || '') === (b.reference || '') && (a.note || '') === (b.note || '');
  }

  function computePaymentSummary(o) {
    const txs = Array.isArray(o.paymentTransactions) ? o.paymentTransactions : [];
    let totalReceived = 0, totalRefunded = 0;
    txs.forEach(t => {
      if (t.type === 'receive' && typeof t.amount === 'number' && Number.isFinite(t.amount)) totalReceived += t.amount;
      else if (t.type === 'refund' && typeof t.amount === 'number' && Number.isFinite(t.amount)) totalRefunded += t.amount;
    });
    const netReceived = totalReceived - totalRefunded;
    const target = resolveReceivableTotal(o);
    const owed = target !== null ? Math.max(0, target - netReceived) : null;
    let paymentStatus;
    if (totalReceived === 0) paymentStatus = 'unpaid';
    else if (netReceived <= 0) paymentStatus = 'refunded';
    else if (target !== null && netReceived >= target) paymentStatus = 'paid';
    else paymentStatus = 'partial';
    return { totalReceived, totalRefunded, netReceived, owed, paymentStatus };
  }

  function renderPaymentSectionHtml(o) {
    const summary = computePaymentSummary(o);
    const txs = Array.isArray(o.paymentTransactions) ? o.paymentTransactions : [];
    const timelineHtml = txs.length
      ? txs.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(t => `
          <div class="payment-history-item">
            <div class="payment-history-main">
              <span class="payment-type-tag payment-type-${escHtml(t.type)}">${escHtml(PAYMENT_TYPE_LABELS[t.type] || t.type || '--')}</span>
              ${fmtMoney(t.amount)}　${escHtml(PAYMENT_METHOD_LABELS[t.method] || t.method || '--')}${t.reference ? '　編號：' + escHtml(t.reference) : ''}
            </div>
            <div class="payment-history-meta">${escHtml(fmtTime(t.createdAt))} · ${escHtml(t.actor || '--')}</div>
            ${t.note ? `<div class="payment-history-note">${escHtml(t.note)}</div>` : ''}
          </div>
        `).join('')
      : '<div style="color:var(--gray-400);font-size:12.5px;">尚無付款紀錄</div>';

    const summaryGridHtml = `
      <div class="payment-summary-grid">
        <div><span class="payment-summary-label">付款狀態</span><span class="status-badge status-payment-${summary.paymentStatus}">${escHtml(PAYMENT_STATUS_LABELS[summary.paymentStatus])}</span></div>
        <div><span class="payment-summary-label">累計收款</span>${fmtMoney(summary.totalReceived)}</div>
        <div><span class="payment-summary-label">累計退款</span>${fmtMoney(summary.totalRefunded)}</div>
        <div><span class="payment-summary-label">實收金額</span>${fmtMoney(summary.netReceived)}</div>
        <div><span class="payment-summary-label">尚欠金額</span>${summary.owed === null ? '--' : fmtMoney(summary.owed)}</div>
      </div>`;

    // 已封存訂單只顯示付款摘要與時間軸（唯讀），不提供新增付款交易的表單，避免修改唯讀訂單。
    if (isOrderArchived(o)) {
      return `
        <h4>付款資料</h4>
        ${summaryGridHtml}
        <div class="payment-history-list">${timelineHtml}</div>
      `;
    }

    // 若有尚未確認成功的付款送出（送出後失敗、或送出後使用者重新整理了頁面），
    // 用暫存的表單內容還原輸入框，讓「重試」自然而然就是送出同一組內容＋同一組 key。
    const pending = loadPendingPayment(o.orderId);
    const formDefaults = pending || { type: 'receive', amount: '', method: 'bank_transfer', reference: '', note: '' };
    const pendingNoticeHtml = pending
      ? '<div style="color:#b45309;font-size:11.5px;margin-top:6px;">偵測到上次付款送出可能尚未完成，已還原表單內容，請確認後直接送出即可（不會重複入帳）。</div>'
      : '';

    return `
      <h4>付款資料</h4>
      ${summaryGridHtml}
      <div class="payment-history-list">${timelineHtml}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <select id="order-detail-payment-type">
          <option value="receive" ${formDefaults.type === 'receive' ? 'selected' : ''}>收款</option>
          <option value="refund" ${formDefaults.type === 'refund' ? 'selected' : ''}>退款</option>
        </select>
        <input type="number" id="order-detail-payment-amount" placeholder="金額" min="0" step="1" style="width:110px;" value="${escHtml(formDefaults.amount)}">
        <select id="order-detail-payment-method">
          <option value="bank_transfer" ${formDefaults.method === 'bank_transfer' ? 'selected' : ''}>銀行匯款</option>
          <option value="cash" ${formDefaults.method === 'cash' ? 'selected' : ''}>現金</option>
          <option value="card" ${formDefaults.method === 'card' ? 'selected' : ''}>刷卡</option>
          <option value="other" ${formDefaults.method === 'other' ? 'selected' : ''}>其他</option>
        </select>
        <input type="text" id="order-detail-payment-reference" placeholder="交易／匯款編號（選填）" maxlength="100" style="flex:1;min-width:140px;" value="${escHtml(formDefaults.reference)}">
      </div>
      <textarea id="order-detail-payment-note" maxlength="500" rows="2" placeholder="內部說明（選填）" style="width:100%;margin-top:6px;">${escHtml(formDefaults.note)}</textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button id="order-detail-payment-add-btn" onclick="addPaymentTransaction('${o.orderId}')">新增付款交易</button>
      </div>
      <div id="order-detail-payment-error" class="detail-field-error"></div>
      ${pendingNoticeHtml}
    `;
  }

  async function addPaymentTransaction(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const typeEl      = document.getElementById('order-detail-payment-type');
    const amountEl     = document.getElementById('order-detail-payment-amount');
    const methodEl     = document.getElementById('order-detail-payment-method');
    const referenceEl  = document.getElementById('order-detail-payment-reference');
    const noteEl       = document.getElementById('order-detail-payment-note');
    const btn          = document.getElementById('order-detail-payment-add-btn');
    const errEl        = document.getElementById('order-detail-payment-error');

    const type   = typeEl.value;
    const amount = Number(amountEl.value);
    const method = methodEl.value;
    const reference = referenceEl.value;
    const note   = noteEl.value;

    // 前端只做最基本的「有沒有填一個合理金額」提示，真正的型別／範圍／退款餘額驗證一律交給後端，
    // 不在這裡重複實作一套規則，避免前後端規則兜不起來。
    if (amountEl.value === '' || !Number.isFinite(amount) || amount <= 0) {
      errEl.textContent = '請輸入大於 0 的金額';
      return;
    }

    const payload = { type, amount, method, reference, note };
    // 冪等鍵：如果 sessionStorage 裡有這筆訂單「尚未確認成功」的付款、且表單內容跟上次完全一樣
    // （代表這是同一筆意圖的重試，不論是使用者手動點第二次，還是頁面重新整理後再送一次），
    // 就沿用同一組 key；只要使用者改過任何欄位，就視為全新的付款意圖，改用一組新 key。
    const pending = loadPendingPayment(orderId);
    const idempotencyKey = (pending && paymentPayloadsMatch(pending, payload)) ? pending.idempotencyKey : crypto.randomUUID();
    savePendingPayment(orderId, Object.assign({ idempotencyKey }, payload));

    [typeEl, amountEl, methodEl, referenceEl, noteEl, btn].forEach(el => el.disabled = true);
    errEl.textContent = '';
    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/payment-transactions`, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ idempotencyKey }, payload))
      });
      const data = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((data && data.error) || '付款交易新增失敗');
      order.paymentTransactions = data.paymentTransactions;
      // 成功（含後端回報的冪等重放 idempotentReplay:true）才清除暫存的 key／表單內容，
      // 下一次送出會是全新的付款意圖、產生全新的 key。重繪整個付款區塊，連帶重建空白表單。
      clearPendingPayment(orderId);
      document.getElementById('order-detail-payment-section').innerHTML = renderPaymentSectionHtml(order);
    } catch (e) {
      // 失敗時保留使用者剛才輸入的內容與 sessionStorage 裡的同一組 key，不重繪、只顯示錯誤
      // 並恢復可編輯；使用者直接重試（或重新整理頁面後再試）都會沿用同一組 key，不會重複入帳。
      errEl.textContent = e.message;
      [typeEl, amountEl, methodEl, referenceEl, noteEl, btn].forEach(el => el.disabled = false);
    }
  }

  // ─── 物流資料：追加式紀錄，跟付款交易同一套冪等設計（sessionStorage 暫存尚未確認成功的
  // key／表單內容，成功才清除），完全獨立於訂單狀態與付款資料之外，純顯示計算不影響任何寫入。
  const LOGISTICS_STATUS_LABELS = { preparing: '備貨中', shipped: '已出貨', delivered: '已送達', returned: '已退回' };
  const LOGISTICS_PENDING_KEY_PREFIX = 'yz_pending_logistics_';

  function logisticsPendingStorageKey(orderId) {
    return LOGISTICS_PENDING_KEY_PREFIX + orderId;
  }
  function loadPendingLogistics(orderId) {
    try {
      const raw = sessionStorage.getItem(logisticsPendingStorageKey(orderId));
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function savePendingLogistics(orderId, payload) {
    try { sessionStorage.setItem(logisticsPendingStorageKey(orderId), JSON.stringify(payload)); } catch {}
  }
  function clearPendingLogistics(orderId) {
    try { sessionStorage.removeItem(logisticsPendingStorageKey(orderId)); } catch {}
  }
  // 判斷使用者這次要送出的表單內容，是否就是上次沒送成功的那一筆——是的話重用同一組 key；
  // 使用者已經把物流商／狀態等改掉的話，代表是新的物流更新意圖，要換一組新 key。
  function logisticsPayloadsMatch(a, b) {
    return a.carrier === b.carrier && (a.trackingNumber || '') === (b.trackingNumber || '') &&
      a.status === b.status && (a.note || '') === (b.note || '');
  }

  // 只讀取伺服器端追加式寫入的 logisticsHistory 算出「最新一筆」當摘要，不猜測、不偽造任何紀錄；
  // 舊訂單沒有這個欄位時安全視為空陣列，摘要一律顯示「尚無物流紀錄」。
  function computeLogisticsSummary(o) {
    const records = Array.isArray(o.logisticsHistory) ? o.logisticsHistory : [];
    if (!records.length) return { latest: null };
    const sorted = records.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    return { latest: sorted[0] };
  }

  function renderLogisticsSectionHtml(o) {
    const summary = computeLogisticsSummary(o);
    const records = Array.isArray(o.logisticsHistory) ? o.logisticsHistory : [];
    const timelineHtml = records.length
      ? records.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(r => `
          <div class="logistics-history-item">
            <div class="logistics-history-main">
              <span class="status-badge status-logistics-${escHtml(r.status)}">${escHtml(LOGISTICS_STATUS_LABELS[r.status] || r.status || '--')}</span>
              ${escHtml(r.carrier || '--')}${r.trackingNumber ? '　單號：' + escHtml(r.trackingNumber) : ''}
            </div>
            <div class="logistics-history-meta">${escHtml(fmtTime(r.createdAt))} · ${escHtml(r.actor || '--')}</div>
            ${r.note ? `<div class="logistics-history-note">${escHtml(r.note)}</div>` : ''}
          </div>
        `).join('')
      : '<div style="color:var(--gray-400);font-size:12.5px;">尚無物流紀錄</div>';

    const summaryHtml = summary.latest
      ? `
        <div class="payment-summary-grid">
          <div><span class="payment-summary-label">最新狀態</span><span class="status-badge status-logistics-${escHtml(summary.latest.status)}">${escHtml(LOGISTICS_STATUS_LABELS[summary.latest.status] || summary.latest.status)}</span></div>
          <div><span class="payment-summary-label">物流商</span>${escHtml(summary.latest.carrier || '--')}</div>
          <div><span class="payment-summary-label">追蹤單號</span>${escHtml(summary.latest.trackingNumber || '--')}</div>
        </div>`
      : '<div style="color:var(--gray-400);font-size:12.5px;margin-bottom:8px;">尚未建立任何物流紀錄</div>';

    // 已封存訂單只顯示物流摘要與時間軸（唯讀），不提供新增物流紀錄的表單，避免修改唯讀訂單。
    if (isOrderArchived(o)) {
      return `
        <h4>物流資料</h4>
        ${summaryHtml}
        <div class="payment-history-list">${timelineHtml}</div>
      `;
    }

    // 若有尚未確認成功的物流送出（送出後失敗、或送出後使用者重新整理了頁面），
    // 用暫存的表單內容還原輸入框，讓「重試」自然而然就是送出同一組內容＋同一組 key。
    const pending = loadPendingLogistics(o.orderId);
    const formDefaults = pending || { carrier: '', trackingNumber: '', status: 'preparing', note: '' };
    const pendingNoticeHtml = pending
      ? '<div style="color:#b45309;font-size:11.5px;margin-top:6px;">偵測到上次物流送出可能尚未完成，已還原表單內容，請確認後直接送出即可（不會重複新增）。</div>'
      : '';

    return `
      <h4>物流資料</h4>
      ${summaryHtml}
      <div class="payment-history-list">${timelineHtml}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <input type="text" id="order-detail-logistics-carrier" placeholder="物流商" maxlength="50" style="width:120px;" value="${escHtml(formDefaults.carrier)}">
        <input type="text" id="order-detail-logistics-tracking" placeholder="追蹤單號（選填）" maxlength="100" style="flex:1;min-width:140px;" value="${escHtml(formDefaults.trackingNumber)}">
        <select id="order-detail-logistics-status">
          <option value="preparing" ${formDefaults.status === 'preparing' ? 'selected' : ''}>備貨中</option>
          <option value="shipped" ${formDefaults.status === 'shipped' ? 'selected' : ''}>已出貨</option>
          <option value="delivered" ${formDefaults.status === 'delivered' ? 'selected' : ''}>已送達</option>
          <option value="returned" ${formDefaults.status === 'returned' ? 'selected' : ''}>已退回</option>
        </select>
      </div>
      <textarea id="order-detail-logistics-note" maxlength="500" rows="2" placeholder="備註（選填）" style="width:100%;margin-top:6px;">${escHtml(formDefaults.note)}</textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button id="order-detail-logistics-add-btn" onclick="addLogisticsRecord('${o.orderId}')">新增物流紀錄</button>
      </div>
      <div id="order-detail-logistics-error" class="detail-field-error"></div>
      ${pendingNoticeHtml}
    `;
  }

  async function addLogisticsRecord(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const carrierEl  = document.getElementById('order-detail-logistics-carrier');
    const trackingEl = document.getElementById('order-detail-logistics-tracking');
    const statusEl   = document.getElementById('order-detail-logistics-status');
    const noteEl     = document.getElementById('order-detail-logistics-note');
    const btn        = document.getElementById('order-detail-logistics-add-btn');
    const errEl      = document.getElementById('order-detail-logistics-error');

    const carrier = carrierEl.value.trim();
    const trackingNumber = trackingEl.value;
    const status = statusEl.value;
    const note = noteEl.value;

    // 前端只做最基本的「物流商不可空白」提示，真正的型別／長度／狀態驗證一律交給後端，
    // 不在這裡重複實作一套規則，避免前後端規則兜不起來。
    if (!carrier) {
      errEl.textContent = '請輸入物流商';
      return;
    }

    const payload = { carrier, trackingNumber, status, note };
    // 冪等鍵：規則跟付款交易完全一致——沿用上次未確認成功的 key（內容相同時），
    // 使用者改過任何欄位就視為新的物流更新意圖，改用一組新 key。
    const pending = loadPendingLogistics(orderId);
    const idempotencyKey = (pending && logisticsPayloadsMatch(pending, payload)) ? pending.idempotencyKey : crypto.randomUUID();
    savePendingLogistics(orderId, Object.assign({ idempotencyKey }, payload));

    [carrierEl, trackingEl, statusEl, noteEl, btn].forEach(el => el.disabled = true);
    errEl.textContent = '';
    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/logistics`, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ idempotencyKey }, payload))
      });
      const data = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((data && data.error) || '物流紀錄新增失敗');
      order.logisticsHistory = data.logisticsHistory;
      // 成功（含後端回報的冪等重放 idempotentReplay:true）才清除暫存的 key／表單內容。
      clearPendingLogistics(orderId);
      document.getElementById('order-detail-logistics-section').innerHTML = renderLogisticsSectionHtml(order);
    } catch (e) {
      // 失敗時保留使用者剛才輸入的內容與 sessionStorage 裡的同一組 key，不重繪、只顯示錯誤
      // 並恢復可編輯；使用者直接重試（或重新整理頁面後再試）都會沿用同一組 key，不會重複新增。
      errEl.textContent = e.message;
      [carrierEl, trackingEl, statusEl, noteEl, btn].forEach(el => el.disabled = false);
    }
  }

  // ─── 人工調價：只呼叫現有 POST /api/orders/:orderId/pricing-adjustments，不重新實作任何
  // 計算公式——折扣／額外費用／運費／稅額／最終總額一律直接顯示後端回傳或已存檔的欄位值，
  // 前端完全不自己算。新台幣整數金額全部沿用既有 fmtMoney()（undefined／null／NaN 一律
  // 安全顯示為「--」，不會出現原始字樣）；priceOnInquiry 商品在還沒有任何人工調整紀錄之前，
  // 畫面上完全不顯示金額數字，只顯示「尚待業務人工報價」，避免看起來像系統自動算出假總額。
  // 冪等設計跟付款交易／物流紀錄同一套：sessionStorage 暫存尚未確認成功的 key 與表單內容，
  // 用訂單 id 分開存放，成功（含後端回報的冪等重放 idempotentReplay:true）才清除。
  const PRICING_ADJUSTMENT_PENDING_KEY_PREFIX = 'yz_pending_pricing_adjustment_';
  const PRICING_SOURCE_LABELS = { auto_quote: '系統自動報價', manual_inquiry: '詢價商品人工基準價' };

  function pricingAdjustmentPendingStorageKey(orderId) {
    return PRICING_ADJUSTMENT_PENDING_KEY_PREFIX + orderId;
  }
  function getPendingPricingAdjustment(orderId) {
    try {
      const raw = sessionStorage.getItem(pricingAdjustmentPendingStorageKey(orderId));
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function savePendingPricingAdjustment(orderId, payload) {
    try { sessionStorage.setItem(pricingAdjustmentPendingStorageKey(orderId), JSON.stringify(payload)); } catch {}
  }
  function clearPendingPricingAdjustment(orderId) {
    try { sessionStorage.removeItem(pricingAdjustmentPendingStorageKey(orderId)); } catch {}
  }
  // 判斷使用者這次要送出的表單內容，是否就是上次沒送成功的那一筆——是的話重用同一組 key；
  // 使用者已經把折扣／額外費用／運費／稅率／原因／人工基準金額任何一個欄位改掉的話，
  // 代表是新的調整意圖，要換一組新 key，不能沿用舊的。
  function pricingAdjustmentPayloadsMatch(a, b) {
    const normBase = v => (v === undefined || v === null || v === '') ? null : Number(v);
    return Number(a.discountAmount) === Number(b.discountAmount) &&
      Number(a.extraFee) === Number(b.extraFee) &&
      Number(a.shippingFee) === Number(b.shippingFee) &&
      Number(a.taxRate) === Number(b.taxRate) &&
      (a.reason || '') === (b.reason || '') &&
      normBase(a.manualBaseAmount) === normBase(b.manualBaseAmount);
  }

  // 目前應顯示的報價：有人工調整紀錄就用最後一筆（依 createdAt 排序，不受寫入順序影響），
  // 完全沒有調整過就是原始自動報價；純粹讀取既有欄位做顯示，不重新計算任何金額。
  function latestPricingAdjustment(o) {
    const adjustments = Array.isArray(o.pricingAdjustments) ? o.pricingAdjustments : [];
    if (!adjustments.length) return null;
    return adjustments.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
  }

  function renderPricingAdjustmentSectionHtml(o) {
    const isPriceOnInquiry = !!(o.quote && o.quote.priceOnInquiry === true);
    const latest = latestPricingAdjustment(o);
    const adjustments = Array.isArray(o.pricingAdjustments)
      ? o.pricingAdjustments.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      : [];

    const originalQuoteText = isPriceOnInquiry
      ? '詢價商品，無系統自動報價'
      : fmtMoney(o.quote && o.quote.total);

    const currentFinalText = latest
      ? fmtMoney(latest.finalTotal)
      : (isPriceOnInquiry ? '尚待業務人工報價' : fmtMoney(o.quote && o.quote.total));

    const summaryGridHtml = `
      <div class="payment-summary-grid">
        <div><span class="payment-summary-label">系統原始報價</span>${escHtml(originalQuoteText)}</div>
        <div><span class="payment-summary-label">目前最終報價</span>${escHtml(currentFinalText)}</div>
        <div><span class="payment-summary-label">折扣金額</span>${latest ? fmtMoney(latest.discountAmount) : '--'}</div>
        <div><span class="payment-summary-label">額外費用</span>${latest ? fmtMoney(latest.extraFee) : '--'}</div>
        <div><span class="payment-summary-label">運費</span>${latest ? fmtMoney(latest.shippingFee) : '--'}</div>
        <div><span class="payment-summary-label">稅率及稅額</span>${latest ? `${escHtml(String(latest.taxRate))}%（${fmtMoney(latest.taxAmount)}）` : '--'}</div>
        <div><span class="payment-summary-label">最終總額</span>${escHtml(currentFinalText)}</div>
        <div><span class="payment-summary-label">最近調整</span>${latest ? `${escHtml(fmtTime(latest.createdAt))} · ${escHtml(latest.reason || '--')}` : '尚無調整紀錄'}</div>
      </div>`;

    const historyHtml = adjustments.length
      ? adjustments.map(a => `
          <div class="payment-history-item">
