            <div class="payment-history-main">
              ${fmtMoney(a.baseAmount)} → ${fmtMoney(a.finalTotal)}
              <span style="color:var(--gray-400);">（${escHtml(PRICING_SOURCE_LABELS[a.baseSource] || a.baseSource || '--')}）</span>
            </div>
            <div class="payment-history-meta">${escHtml(fmtTime(a.createdAt))} · ${escHtml(a.actor || '--')}</div>
            <div class="payment-history-note">折扣 ${fmtMoney(a.discountAmount)}　額外費用 ${fmtMoney(a.extraFee)}　運費 ${fmtMoney(a.shippingFee)}　稅率 ${escHtml(String(a.taxRate))}%（稅額 ${fmtMoney(a.taxAmount)}）</div>
            ${a.reason ? `<div class="payment-history-note">原因：${escHtml(a.reason)}</div>` : ''}
          </div>
        `).join('')
      : '<div style="color:var(--gray-400);font-size:12.5px;">尚無人工調整紀錄</div>';

    // 已封存訂單只顯示目前報價與歷程（唯讀），不提供人工調價表單——後端本來就會用既有
    // guardOrderNotArchived() 擋下已封存訂單（409），這裡只是連表單都不顯示，不讓管理員
    // 白填一次被拒絕；不可只靠前端這道防護，後端的 409 判斷順序完全沒有被改動。
    if (isOrderArchived(o)) {
      return `
        <h4>人工調價</h4>
        ${summaryGridHtml}
        <div class="payment-history-list">${historyHtml}</div>
      `;
    }

    // 若有尚未確認成功的調價送出（送出後失敗、或送出後使用者重新整理了頁面），
    // 用暫存的表單內容還原輸入框，讓「重試」自然而然就是送出同一組內容＋同一組 key，
    // 不會因為重新整理就換一組新的 idempotencyKey。
    const pending = getPendingPricingAdjustment(o.orderId);
    const formDefaults = pending || { discountAmount: 0, extraFee: 0, shippingFee: 0, taxRate: 0, reason: '', manualBaseAmount: '' };
    const pendingNoticeHtml = pending
      ? '<div style="color:#b45309;font-size:11.5px;margin-top:6px;">上次送出尚未確認成功，重新送出會沿用同一識別碼（不會重複建立調整紀錄）。</div>'
      : '';
    const manualBaseAmountValue = (formDefaults.manualBaseAmount === undefined || formDefaults.manualBaseAmount === null || formDefaults.manualBaseAmount === '')
      ? '' : formDefaults.manualBaseAmount;

    return `
      <h4>人工調價</h4>
      ${summaryGridHtml}
      <div class="payment-history-list">${historyHtml}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <input type="number" id="order-detail-pricing-discount" placeholder="折扣金額" min="0" step="1" style="width:110px;" value="${escHtml(formDefaults.discountAmount)}">
        <input type="number" id="order-detail-pricing-extra" placeholder="額外費用" min="0" step="1" style="width:110px;" value="${escHtml(formDefaults.extraFee)}">
        <input type="number" id="order-detail-pricing-shipping" placeholder="運費" min="0" step="1" style="width:110px;" value="${escHtml(formDefaults.shippingFee)}">
        <input type="number" id="order-detail-pricing-taxrate" placeholder="稅率（%）" min="0" max="100" step="0.01" style="width:110px;" value="${escHtml(formDefaults.taxRate)}">
        ${isPriceOnInquiry ? `<input type="number" id="order-detail-pricing-manualbase" placeholder="人工基準金額（必填）" min="1" step="1" style="width:150px;" value="${escHtml(manualBaseAmountValue)}">` : ''}
      </div>
      <textarea id="order-detail-pricing-reason" maxlength="500" rows="2" placeholder="調整原因（必填）" style="width:100%;margin-top:6px;">${escHtml(formDefaults.reason)}</textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button id="order-detail-pricing-submit-btn" onclick="submitPricingAdjustment('${o.orderId}')">儲存人工調價</button>
      </div>
      <div id="order-detail-pricing-error" class="detail-field-error"></div>
      ${pendingNoticeHtml}
    `;
  }

  async function submitPricingAdjustment(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const isPriceOnInquiry = !!(order.quote && order.quote.priceOnInquiry === true);

    const discountEl   = document.getElementById('order-detail-pricing-discount');
    const extraEl      = document.getElementById('order-detail-pricing-extra');
    const shippingEl   = document.getElementById('order-detail-pricing-shipping');
    const taxRateEl    = document.getElementById('order-detail-pricing-taxrate');
    const reasonEl     = document.getElementById('order-detail-pricing-reason');
    const manualBaseEl = document.getElementById('order-detail-pricing-manualbase'); // 只有 priceOnInquiry 商品才存在
    const btn          = document.getElementById('order-detail-pricing-submit-btn');
    const errEl        = document.getElementById('order-detail-pricing-error');

    const discountAmount   = discountEl.value === '' ? 0 : Number(discountEl.value);
    const extraFee         = extraEl.value === '' ? 0 : Number(extraEl.value);
    const shippingFee      = shippingEl.value === '' ? 0 : Number(shippingEl.value);
    const taxRate           = taxRateEl.value === '' ? 0 : Number(taxRateEl.value);
    const reason             = reasonEl.value.trim();
    const manualBaseAmount   = manualBaseEl ? (manualBaseEl.value === '' ? null : Number(manualBaseEl.value)) : null;

    // 前端只做最基本的必填與數字格式檢查，真正的型別／範圍／安全整數溢位驗證一律交給後端，
    // 不在這裡重複實作一套規則，避免前後端規則兜不起來（跟付款交易／物流紀錄同一套原則）。
    if (!Number.isInteger(discountAmount) || discountAmount < 0) { errEl.textContent = '折扣金額必須是不小於 0 的整數'; return; }
    if (!Number.isInteger(extraFee) || extraFee < 0) { errEl.textContent = '額外費用必須是不小於 0 的整數'; return; }
    if (!Number.isInteger(shippingFee) || shippingFee < 0) { errEl.textContent = '運費必須是不小於 0 的整數'; return; }
    if (!Number.isFinite(taxRate) || taxRate < 0 || taxRate > 100) { errEl.textContent = '稅率必須是 0～100 之間的數字'; return; }
    if (!reason) { errEl.textContent = '請填寫調整原因'; return; }
    if (isPriceOnInquiry && (!Number.isInteger(manualBaseAmount) || manualBaseAmount < 1)) {
      errEl.textContent = '詢價商品必須填寫人工基準金額（正整數）';
      return;
    }

    const payload = { discountAmount, extraFee, shippingFee, taxRate, reason };
    if (isPriceOnInquiry) payload.manualBaseAmount = manualBaseAmount;

    // 冪等鍵：規則跟付款交易／物流紀錄完全一致——內容跟上次未確認成功的那筆完全相同就沿用
    // 同一組 key（代表這是同一次調整意圖的重試），使用者改過任何欄位就換一組新 key。
    const pending = getPendingPricingAdjustment(orderId);
    const idempotencyKey = (pending && pricingAdjustmentPayloadsMatch(pending, payload)) ? pending.idempotencyKey : crypto.randomUUID();
    savePendingPricingAdjustment(orderId, Object.assign({ idempotencyKey }, payload));

    const fieldsToDisable = [discountEl, extraEl, shippingEl, taxRateEl, reasonEl, btn];
    if (manualBaseEl) fieldsToDisable.push(manualBaseEl);
    fieldsToDisable.forEach(el => el.disabled = true);
    errEl.textContent = '';

    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/pricing-adjustments`, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ idempotencyKey }, payload))
      });
      const data = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((data && data.error) || '人工調價儲存失敗');

      // 只信任後端回傳的 adjustment／currentPricing 更新畫面，不自行認定計算結果；用 id
      // 判斷是否已存在（idempotentReplay:true 時後端回傳的是已經存在的那一筆），避免同一筆
      // 冪等重放在畫面上被重複疊加成兩筆歷程。
      if (!Array.isArray(order.pricingAdjustments)) order.pricingAdjustments = [];
      const exists = order.pricingAdjustments.some(a => a.id === data.adjustment.id);
      if (!exists) order.pricingAdjustments.push(data.adjustment);

      // 成功（含後端回報的冪等重放 idempotentReplay:true）才清除暫存的 key／表單內容，
      // 下一次送出會是全新的調整意圖、產生全新的 key。只重繪人工調價區塊，不重建整個詳情
      // 面板，避免影響付款／物流／備註等其他表單裡使用者可能還沒送出的內容。
      clearPendingPricingAdjustment(orderId);
      document.getElementById('order-detail-pricing-section').innerHTML = renderPricingAdjustmentSectionHtml(order);
    } catch (e) {
      // 失敗（含網路中斷）時保留使用者剛才輸入的內容與 sessionStorage 裡的同一組 key，
      // 不重繪、只顯示錯誤並恢復可編輯；使用者直接重試（或重新整理頁面後再試）都會沿用
      // 同一組 key，後端冪等機制保證就算「其實已經寫入成功、只是回應遺失」也不會重複入帳。
      errEl.textContent = e.message;
      fieldsToDisable.forEach(el => el.disabled = false);
    }
  }

  // ─── 報價版本及有效期限：後台只負責發布與唯讀顯示，串接既有
  // POST /api/orders/:orderId/quote-versions；版本編號／有效期限／金額快照全部由後端
  // 產生與計算，前端完全不自行推算，只信任後端回傳的 quoteVersion／quoteVersions。
  // 已發布版本不可修改或刪除（後端本來就沒有 PUT/PATCH/DELETE），畫面上也不提供任何
  // 編輯／刪除／覆蓋按鈕，價格變動一律只能發布下一版。
  // 冪等設計跟付款交易／物流紀錄／人工調價同一套：sessionStorage 暫存尚未確認成功的
  // key 與表單內容，用訂單 id 分開存放，成功（含後端回報的冪等重放 idempotentReplay:true）
  // 才清除。
  const QUOTE_VERSION_PENDING_KEY_PREFIX = 'yz_pending_quote_version_';
  const QUOTE_VERSION_SOURCE_LABELS = { auto_quote: '系統自動報價', manual_inquiry: '詢價商品人工基準價' };

  function quoteVersionPendingStorageKey(orderId) {
    return QUOTE_VERSION_PENDING_KEY_PREFIX + orderId;
  }
  function getPendingQuoteVersion(orderId) {
    try {
      const raw = sessionStorage.getItem(quoteVersionPendingStorageKey(orderId));
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function savePendingQuoteVersion(orderId, payload) {
    try { sessionStorage.setItem(quoteVersionPendingStorageKey(orderId), JSON.stringify(payload)); } catch {}
  }
  function clearPendingQuoteVersion(orderId) {
    try { sessionStorage.removeItem(quoteVersionPendingStorageKey(orderId)); } catch {}
  }
  // 嚴格比較，完全不做任何強制轉型：
  // - a、b 必須都是有效物件，否則直接視為不同意圖。
  // - validDays 兩邊都必須是 number／有限／整數／介於 1～365，再用 === 嚴格比較；
  //   不合法（缺漏、字串、小數、NaN、超出範圍）一律視為不同，不可用 Number() 硬轉。
  // - notes 兩邊都必須已經是字串才可能相符，任一邊不是字串（例如 pending 曾被寫入非法
  //   型別 123／{}／null／缺漏）一律直接視為不同，不可轉成空字串比較——這正是要修正的
  //   問題：舊版把非字串 notes 正規化成 ''，會讓「pending.notes=123」跟「目前 notes=''」
  //   被誤判成同一次發布意圖而錯誤沿用不該沿用的 idempotencyKey。兩邊都是字串時才用
  //   trim() 後的文字比較（正常表單送出的 notes 永遠已經是字串，這裡的型別檢查只是防止
  //   pending 內容被外部竄改成不合法型別時被誤判為相同）。
  function quoteVersionPayloadsMatch(a, b) {
    if (!a || typeof a !== 'object' || !b || typeof b !== 'object') return false;

    const validDaysValid = v => typeof v === 'number' && Number.isFinite(v) && Number.isInteger(v) && v >= 1 && v <= 365;
    if (!validDaysValid(a.validDays) || !validDaysValid(b.validDays)) return false;
    if (a.validDays !== b.validDays) return false;

    if (typeof a.notes !== 'string' || typeof b.notes !== 'string') return false;
    return a.notes.trim() === b.notes.trim();
  }

  // 舊訂單沒有 quoteVersions 欄位、或欄位不是陣列時一律安全視為空陣列；陣列裡混入
  // 非物件的異常項目也直接濾掉，避免單筆壞資料讓整個訂單詳情面板崩潰。
  function quoteVersionsArray(o) {
    return Array.isArray(o.quoteVersions) ? o.quoteVersions.filter(v => v && typeof v === 'object') : [];
  }
  // 「最新版本」＝ versionNumber 最大的那一筆（不是陣列最後一筆，避免資料手動編輯過、
  // 追加順序跟版本號不一致時判斷錯誤）；versionNumber 格式異常時退而用 createdAt 排序。
  function sortedQuoteVersionsDesc(o) {
    return quoteVersionsArray(o).slice().sort((a, b) => {
      const an = (typeof a.versionNumber === 'number' && Number.isInteger(a.versionNumber)) ? a.versionNumber : -Infinity;
      const bn = (typeof b.versionNumber === 'number' && Number.isInteger(b.versionNumber)) ? b.versionNumber : -Infinity;
      if (an !== bn) return bn - an;
      return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    });
  }
  function latestQuoteVersion(o) {
    const sorted = sortedQuoteVersionsDesc(o);
    return sorted.length ? sorted[0] : null;
  }

  // 純畫面判斷：只比較 validUntil 跟目前時間，不會因為打開這個頁面就去改寫訂單 JSON，
  // 也沒有任何背景自動更新的 API——過期與否永遠是「當下看的那一刻」重新算出來的。
  function quoteVersionDisplayStatus(version) {
    const raw = version && version.validUntil;
    if (!raw) return { key: 'invalid', label: '日期異常' };
    const d = new Date(raw);
    if (Number.isNaN(d.getTime())) return { key: 'invalid', label: '日期異常' };
    return d.getTime() >= Date.now() ? { key: 'valid', label: '有效' } : { key: 'expired', label: '已過期' };
  }

  // 純粹給 confirm() 對話框顯示用的「預估下一版名稱」，不是權威版本號——真正的
  // versionNumber／versionLabel 一律以後端回傳為準，這裡算錯或跟後端不同也不影響任何
  // 實際寫入的資料，純粹讓使用者發布前看得懂自己要建立的是第幾版。
  function estimateNextQuoteVersionLabel(o) {
    let max = 0;
    quoteVersionsArray(o).forEach(v => {
      if (typeof v.versionNumber === 'number' && Number.isInteger(v.versionNumber) && v.versionNumber > max) max = v.versionNumber;
    });
    return 'V' + (max + 1);
  }

  function renderQuoteVersionHistoryItemHtml(v, o, latest) {
    const status = quoteVersionDisplayStatus(v);
    const versionLabel = escHtml(v.versionLabel || (typeof v.versionNumber === 'number' ? ('V' + v.versionNumber) : '--'));
    const product = (v.productSnapshot && typeof v.productSnapshot === 'object') ? v.productSnapshot : {};
    const customer = (v.customerSnapshot && typeof v.customerSnapshot === 'object') ? v.customerSnapshot : {};
    const pricing = (v.pricingSnapshot && typeof v.pricingSnapshot === 'object') ? v.pricingSnapshot : {};
    const baseSourceLabel = pricing.baseSource
      ? (QUOTE_VERSION_SOURCE_LABELS[pricing.baseSource] || '未知來源')
      : '--';
    const validDaysText = (typeof v.validDays === 'number' && Number.isFinite(v.validDays)) ? String(v.validDays) : '--';
    const taxRateText = (typeof pricing.taxRate === 'number' && Number.isFinite(pricing.taxRate)) ? (String(pricing.taxRate) + '%') : '--';
    return `
      <div class="quote-version-history-item">
        <div class="quote-version-history-main">
          ${versionLabel}
          <span class="status-badge status-quoteversion-${status.key}">${escHtml(status.label)}</span>
        </div>
        <div class="quote-version-history-meta">發布時間：${escHtml(fmtTime(v.createdAt))}　有效期限：${escHtml(fmtTime(v.validUntil))}（${escHtml(validDaysText)} 天）　發布者：${escHtml(v.actor || '--')}</div>
        <div style="margin-top:6px;">
          <button type="button" onclick="previewQuoteVersion('${o.orderId}','${v.id}')">預覽正式報價單</button>
        </div>
        ${v.notes ? `<div class="quote-version-history-note">備註：${escHtml(v.notes)}</div>` : ''}
        <div class="quote-version-history-block">
          <div class="quote-version-history-block-title">商品快照</div>
          商品名稱 ${escHtml(product.name || '--')}　材質 ${escHtml(product.material || '--')}　工藝 ${escHtml(product.finish || '--')}　容量 ${escHtml(product.capacity != null ? String(product.capacity) : '--')}　數量 ${fmtQty(product.qty)}
        </div>
        <div class="quote-version-history-block">
          <div class="quote-version-history-block-title">客戶快照</div>
          姓名 ${escHtml(customer.name || '--')}　Email ${escHtml(customer.email || '--')}　電話 ${escHtml(customer.phone || '--')}
        </div>
        <div class="quote-version-history-block">
          <div class="quote-version-history-block-title">金額快照</div>
          基準金額 ${fmtMoney(pricing.baseAmount)}（${escHtml(baseSourceLabel)}）　折扣 ${fmtMoney(pricing.discountAmount)}　額外費用 ${fmtMoney(pricing.extraFee)}　運費 ${fmtMoney(pricing.shippingFee)}　稅率 ${escHtml(taxRateText)}（稅額 ${fmtMoney(pricing.taxAmount)}）　稅前金額 ${fmtMoney(pricing.preTaxAmount)}　最終總額 ${fmtMoney(pricing.finalTotal)}
        </div>
        ${renderCustomerAccessLinkHtml(o, v, latest)}
      </div>
    `;
  }

  // ─── 正式報價單預覽／列印：開新視窗（quote-print.html），只用 postMessage 把「這一個
  // 報價版本」的固定快照欄位（productSnapshot／customerSnapshot／pricingSnapshot／
  // versionLabel／createdAt／validUntil／notes）傳過去，完全不呼叫任何 API、不新增
  // 後端路由——新視窗本身沒有 orderId、沒有登入Session，也就沒有任何管道能讀到
  // 會隨時間變動的目前訂單資料（狀態、負責人、付款、物流……），只可能顯示這一次
  // 明確傳入的快照內容。深層複製（JSON.parse(JSON.stringify(...))）確保新視窗跟
  // orders 陣列不共用任何可變參照，預覽/列印不可能反過來改到後台記憶體裡的訂單資料，
  // 也完全不會寫入 order 物件或呼叫任何寫入類 API。
  function previewQuoteVersion(orderId, versionId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const version = quoteVersionsArray(order).find(v => v.id === versionId);
    if (!version) return;

    const latest = latestQuoteVersion(order);
    const isLatest = !!(latest && version.id === latest.id);

    const payload = JSON.parse(JSON.stringify({
      versionLabel: version.versionLabel,
      createdAt: version.createdAt,
      validUntil: version.validUntil,
      notes: version.notes || '',
      productSnapshot: version.productSnapshot || {},
      customerSnapshot: version.customerSnapshot || {},
      pricingSnapshot: version.pricingSnapshot || {},
      isLatest
    }));

    const printWindow = window.open('quote-print.html', '_blank');
    if (!printWindow) {
      alert('無法開啟報價單視窗，請確認瀏覽器未封鎖彈出視窗後再試一次。');
      return;
    }

    // 新視窗載入完成後會自己主動送出 ready 訊號（可能重試多次，涵蓋視窗還沒完成
    // 載入監聽器就被觸發的競速情況）；收到第一次 ready 訊號就回傳資料，最多等待
    // 10 秒後自動移除監聽器，避免在背景無限期留著。
    function handleMessage(event) {
      if (event.source !== printWindow) return;
      if (event.origin !== location.origin) return;
      if (!event.data || event.data.type !== 'quote-print-ready') return;
      printWindow.postMessage({ type: 'quote-print-data', payload }, location.origin);
    }
    window.addEventListener('message', handleMessage);
    setTimeout(() => window.removeEventListener('message', handleMessage), 10000);
  }

  // ─── 客戶確認連結：只有「訂單未封存、此版本是最新版本、尚未過期、尚未收到客戶回覆」
  // 同時成立時才顯示按鈕，其餘情況一律只顯示原因、不顯示按鈕——這四個條件跟後端
  // POST .../customer-access 既有的四道前置檢查（guardOrderNotArchived／
  // isLatestQuoteVersion／checkQuoteVersionNotExpired／customerResponse 是否已存在）
  // 完全對應，前端只是提前擋掉一定會失敗的操作，真正的權威判斷仍然在後端。
  // 原始 Token 只存在 API 回應這一次：只用來組成連結顯示在畫面上讓管理員複製，絕不
  // 寫入 order 物件、localStorage、sessionStorage、console 或網址 query string，
  // 關閉或重新整理頁面後就再也拿不到，跟後端「原始 token 只回傳這一次」的設計一致。
  // 這段固定警告文字是純靜態字串（不含任何使用者或伺服器資料），首次渲染（已經有
  // customerAccess，例如重新整理頁面後）與產生連結成功當下（generateCustomerAccessLink()
  // 動態插入）共用同一份常數，避免兩處各自維護、日後改字漏改其中一邊。
  const QUOTE_VERSION_CUSTOMER_LINK_REGENERATE_WARNING_HTML =
    '<div style="color:#b45309;font-size:11.5px;margin-top:4px;">已產生過確認連結；重新產生後，舊連結會立即失效、無法再使用。</div>';

  function renderCustomerAccessLinkHtml(o, v, latest) {
    const isLatest = !!(latest && v.id === latest.id);
    const archived = isOrderArchived(o);
    const status = quoteVersionDisplayStatus(v);
    const notValid = status.key !== 'valid';
    const responded = !!v.customerResponse;

    let reason = '';
    if (archived) {
      reason = '訂單已封存，無法產生客戶確認連結。';
    } else if (!isLatest) {
      reason = '非最新版本，無法產生客戶確認連結。';
    } else if (notValid) {
      reason = '此版本已過期，無法產生客戶確認連結。';
    } else if (responded) {
      const decisionLabel = v.customerResponse.decision === 'accepted' ? '已接受'
        : (v.customerResponse.decision === 'rejected' ? '已拒絕' : '已回覆');
      reason = `此版本已收到客戶回覆（${escHtml(decisionLabel)}），無法再產生確認連結。`;
    }

    if (reason) {
      return `<div style="margin-top:8px;font-size:12px;color:var(--gray-400);">${reason}</div>`;
    }

    const hasExisting = !!v.customerAccess;
    const btnLabel = hasExisting ? '重新產生連結' : '產生確認連結';
    const warningHtml = hasExisting ? QUOTE_VERSION_CUSTOMER_LINK_REGENERATE_WARNING_HTML : '';

    return `
      <div style="margin-top:8px;">
        <button type="button" id="qc-link-btn-${v.id}" onclick="generateCustomerAccessLink('${o.orderId}','${v.id}')">${btnLabel}</button>
        <div id="qc-link-warning-${v.id}">${warningHtml}</div>
        <div id="qc-link-area-${v.id}"></div>
        <div id="qc-link-error-${v.id}" class="detail-field-error"></div>
      </div>
    `;
  }

  async function generateCustomerAccessLink(orderId, versionId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const version = quoteVersionsArray(order).find(v => v.id === versionId);
    if (!version) return;

    const btn = document.getElementById(`qc-link-btn-${versionId}`);
    const areaEl = document.getElementById(`qc-link-area-${versionId}`);
    const errEl = document.getElementById(`qc-link-error-${versionId}`);
    const warningEl = document.getElementById(`qc-link-warning-${versionId}`);
    if (!btn || !areaEl || !errEl) return;

    // 二次確認：重新產生時訊息明確警告舊連結會立即失效；取消的話完全不呼叫 API、
    // 不改變任何畫面或資料狀態。adminRunAction()包住整個流程（含確認對話框），按鈕從
    // 觸發當下就鎖定，避免快速連點開出兩個確認視窗、各自確認後各送一次API的競態；
    // busyText仍傳null（只借用disable＋防重複送出防護），文字繼續自己手動管理——
    // 成功時按鈕文字要永久改成「重新產生連結」（不是恢復成呼叫前的文字），這跟
    // adminRunAction()「一律恢復成呼叫前原始文字」的通用行為衝突，所以不能用busyText參數。
    const isRegenerate = !!version.customerAccess;
    await adminRunAction(btn, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: isRegenerate ? '確認重新產生連結' : '確認產生連結',
        message: isRegenerate
          ? '重新產生連結後，舊的客戶確認連結會立即失效、無法再使用，確定要重新產生嗎？'
          : '確定要產生客戶確認連結嗎？',
        danger: isRegenerate,
        confirmLabel: isRegenerate ? '確認重新產生' : '確認產生'
      });
      if (!confirmed) return; // 取消確認時完全不呼叫API、不改變任何畫面或資料狀態
      errEl.textContent = '';

      const originalLabel = btn.textContent;
      btn.textContent = '產生中…';
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/quote-versions/${encodeURIComponent(versionId)}/customer-access`, {
          method: 'POST'
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '確認連結建立失敗');
        if (!data || typeof data.token !== 'string') throw new Error('伺服器回應格式異常，未取得連結');

        // Token 只在這次回應中出現一次，只用來組成連結字串顯示在畫面上；不寫進 order
        // 物件、不存進任何瀏覽器儲存空間、不印到 console，也不會出現在網址上。
        const link = `${location.origin}/quote-confirmation.html#token=${data.token}`;

        // 本地只記錄「已經產生過連結」這個事實（不含 tokenHash，前端本來就拿不到、
        // 也不需要），讓畫面之後重繪時按鈕文字能正確顯示成「重新產生連結」。
        version.customerAccess = { createdAt: new Date().toISOString(), expiresAt: data.expiresAt };

        // 產生成功當下就要能看到「重新產生會讓舊連結失效」的警告，不能等到下一次整個
        // 報價版本區塊重繪才出現——這裡插入的是完全固定的靜態字串，不含任何使用者或
        // 伺服器資料，所以用 innerHTML 賦值不會有 XSS 疑慮。
        if (warningEl) warningEl.innerHTML = QUOTE_VERSION_CUSTOMER_LINK_REGENERATE_WARNING_HTML;

        areaEl.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.style.marginTop = '6px';

        const linkInput = document.createElement('input');
        linkInput.type = 'text';
        linkInput.readOnly = true;
        linkInput.value = link;
        linkInput.id = `qc-link-input-${versionId}`;
        linkInput.style.cssText = 'width:100%;font-size:12px;';
        linkInput.addEventListener('focus', () => linkInput.select());

        const copyRow = document.createElement('div');
        copyRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:4px;';

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.textContent = '複製連結';
        copyBtn.onclick = function () { copyCustomerAccessLink(versionId); };

        const copiedLabel = document.createElement('span');
        copiedLabel.id = `qc-link-copied-${versionId}`;
        copiedLabel.style.cssText = 'font-size:11.5px;color:var(--green);';

        copyRow.appendChild(copyBtn);
        copyRow.appendChild(copiedLabel);
        wrap.appendChild(linkInput);
        wrap.appendChild(copyRow);
        areaEl.appendChild(wrap);

        btn.textContent = '重新產生連結';
      } catch (e) {
        errEl.textContent = e.message;
        btn.textContent = originalLabel;
      }
    });
  }

  function copyCustomerAccessLink(versionId) {
    const input = document.getElementById(`qc-link-input-${versionId}`);
    const copiedLabel = document.getElementById(`qc-link-copied-${versionId}`);
    if (!input) return;

    function showCopied() {
      if (!copiedLabel) return;
      copiedLabel.textContent = '已複製';
      setTimeout(() => { copiedLabel.textContent = ''; }, 2000);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(input.value).then(showCopied).catch(() => {
        input.select();
        document.execCommand('copy');
        showCopied();
      });
    } else {
      input.select();
      document.execCommand('copy');
      showCopied();
    }
  }

  function renderQuoteVersionSectionHtml(o) {
    const versions = quoteVersionsArray(o);
    const latest = latestQuoteVersion(o);

    const summaryGridHtml = latest ? `
      <div class="payment-summary-grid">
        <div><span class="payment-summary-label">已發布版本數量</span>${versions.length}</div>
        <div><span class="payment-summary-label">最新版本</span>${escHtml(latest.versionLabel || (typeof latest.versionNumber === 'number' ? ('V' + latest.versionNumber) : '--'))}</div>
        <div><span class="payment-summary-label">最新版本最終總額</span>${fmtMoney(latest.pricingSnapshot && latest.pricingSnapshot.finalTotal)}</div>
        <div><span class="payment-summary-label">發布時間</span>${escHtml(fmtTime(latest.createdAt))}</div>
        <div><span class="payment-summary-label">有效期限</span>${escHtml(fmtTime(latest.validUntil))}</div>
        <div><span class="payment-summary-label">目前狀態</span><span class="status-badge status-quoteversion-${quoteVersionDisplayStatus(latest).key}">${escHtml(quoteVersionDisplayStatus(latest).label)}</span></div>
      </div>`
      : '<div style="color:var(--gray-400);font-size:12.5px;margin-bottom:10px;">尚未發布正式報價版本</div>';

    const historyHtml = versions.length
      ? sortedQuoteVersionsDesc(o).map(v => renderQuoteVersionHistoryItemHtml(v, o, latest)).join('')
      : '';

    // 已封存訂單只顯示目前狀態摘要與完整歷程（唯讀），不提供發布表單或按鈕——後端本來就會用
    // 既有 guardOrderNotArchived() 擋下已封存訂單（409），這裡只是連表單都不顯示，不讓管理員
    // 白填一次被拒絕；不可只靠前端這道防護，後端的 409 判斷順序完全沒有被改動。
    if (isOrderArchived(o)) {
      return `
        <h4>報價版本</h4>
        ${summaryGridHtml}
        <div class="payment-history-list">${historyHtml}</div>
      `;
    }

    // 若有尚未確認成功的發布送出（送出後失敗、或送出後使用者重新整理了頁面），
    // 用暫存的表單內容還原輸入框，讓「重試」自然而然就是送出同一組內容＋同一組 key。
    const pending = getPendingQuoteVersion(o.orderId);
    const formDefaults = pending || { validDays: systemDefaultQuoteValidDays, notes: '' };
    const pendingNoticeHtml = pending
      ? '<div style="color:#b45309;font-size:11.5px;margin-top:6px;">上次發布尚未確認成功，重新送出會沿用同一識別碼，不會重複建立版本。</div>'
      : '';

    // priceOnInquiry 商品在完成至少一筆人工調價之前完全無法發布——沒有真實金額可用，
    // 不可自行補 0 元或假價格；後端 resolvePublishablePricing() 本來就會拒絕，這裡只是
    // 提前停用按鈕、不讓管理員白填一次被拒絕。
    const isPriceOnInquiry = !!(o.quote && o.quote.priceOnInquiry === true);
    const hasAdjustment = Array.isArray(o.pricingAdjustments) && o.pricingAdjustments.length > 0;
    const canPublish = !isPriceOnInquiry || hasAdjustment;
    const blockedNoticeHtml = canPublish
      ? ''
      : '<div style="color:#b45309;font-size:11.5px;margin-top:6px;">詢價商品必須先完成人工調價，才能發布正式報價版本。</div>';

    return `
      <h4>報價版本</h4>
      ${summaryGridHtml}
      <div class="payment-history-list">${historyHtml}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;">
        <input type="number" id="order-detail-quoteversion-validdays" min="1" max="365" step="1" style="width:110px;" value="${escHtml(formDefaults.validDays)}">
        <span style="font-size:12px;color:var(--gray-400);">天有效（1～365）</span>
      </div>
      <textarea id="order-detail-quoteversion-notes" maxlength="1000" rows="2" placeholder="報價備註（選填）" style="width:100%;margin-top:6px;">${escHtml(formDefaults.notes)}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:6px;">
        <span style="font-size:11px;color:var(--gray-400);">發布後不可修改或刪除；價格變更時請重新發布下一版本。</span>
        <button id="order-detail-quoteversion-submit-btn" onclick="submitQuoteVersion('${o.orderId}')" ${canPublish ? '' : 'disabled'}>發布新報價版本</button>
      </div>
      <div id="order-detail-quoteversion-error" class="detail-field-error"></div>
      ${blockedNoticeHtml}
      ${pendingNoticeHtml}
    `;
  }

  async function submitQuoteVersion(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;

    const isPriceOnInquiry = !!(order.quote && order.quote.priceOnInquiry === true);
    const hasAdjustment = Array.isArray(order.pricingAdjustments) && order.pricingAdjustments.length > 0;
    const canPublish = !isPriceOnInquiry || hasAdjustment;

    const validDaysEl = document.getElementById('order-detail-quoteversion-validdays');
    const notesEl     = document.getElementById('order-detail-quoteversion-notes');
    const btn         = document.getElementById('order-detail-quoteversion-submit-btn');
    const errEl       = document.getElementById('order-detail-quoteversion-error');

    // 按鈕已經在畫面上被停用，這裡是防止用其他方式（例如主控台）繞過畫面直接呼叫的
    // 最後一道前端防呆；真正禁止寫入的仍然是後端 resolvePublishablePricing()。
    if (!canPublish) {
      errEl.textContent = '詢價商品必須先完成人工調價，才能發布正式報價版本。';
      return;
    }

    // 前端只做最基本的必填與格式檢查，真正的範圍／格式驗證一律以後端 validatePublishFields()
    // 為準，不在這裡重複實作一套規則，避免前後端規則兜不起來（跟付款交易／人工調價同一套原則）。
    const validDays = Number(validDaysEl.value);
    if (validDaysEl.value === '' || !Number.isInteger(validDays) || validDays < 1 || validDays > 365) {
      errEl.textContent = '有效天數必須是 1～365 之間的正整數';
      return;
    }
    const notes = notesEl.value.trim();
    if (notes.length > 1000) {
      errEl.textContent = '報價備註長度不可超過 1000 字';
      return;
    }

    // 發布前二次確認：取消的話完全不建立 idempotencyKey、不寫入 sessionStorage、
    // 不呼叫任何 API，表單內容原封不動保留，讓使用者可以直接修改後再送一次。adminRunAction()
    // 包住從確認對話框開始的整個流程，按鈕從觸發當下就鎖定，避免快速連點開出兩個確認視窗、
    // 各自確認後各送一次API的競態；busyText傳null（只借用disable＋防重複送出防護），
    // 「發布中…」文字改成確認後才手動設定，避免使用者在還沒確認前就看到「發布中」字樣。
    const nextLabel = estimateNextQuoteVersionLabel(order);
    const originalBtnLabel = btn.textContent;
    await adminRunAction(btn, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認發布報價版本',
        message: `即將發布報價版本「${nextLabel}」，有效天數 ${validDays} 天。發布後不可修改或刪除，價格變更時請重新發布下一版本，確定要發布嗎？`,
        danger: true,
        confirmLabel: '確認發布'
      });
      if (!confirmed) return; // 取消確認時完全不建立idempotencyKey、不寫入sessionStorage、不呼叫API，表單內容原封不動保留

      const payload = { validDays, notes };
      // 冪等鍵：規則跟付款交易／物流紀錄／人工調價完全一致——內容跟上次未確認成功的那筆完全
      // 相同就沿用同一組 key（代表這是同一次發布意圖的重試），使用者改過有效天數或備註就換一組新 key。
      const pending = getPendingQuoteVersion(orderId);
      const idempotencyKey = (pending && quoteVersionPayloadsMatch(pending, payload)) ? pending.idempotencyKey : crypto.randomUUID();
      savePendingQuoteVersion(orderId, Object.assign({ idempotencyKey }, payload));

      errEl.textContent = '';
      btn.textContent = '發布中…';
      validDaysEl.disabled = true; notesEl.disabled = true;
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/quote-versions`, {
          method: 'POST',
          body: JSON.stringify(Object.assign({ idempotencyKey }, payload))
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '報價版本發布失敗');

        // 只信任後端回傳的 quoteVersions 更新畫面：後端每次都回傳完整、依追加順序排列的陣列
        // （不論這次是新建版本還是冪等重放），直接整批取代即可，不用自己判斷是否重複、不用
        // 自己編版本號、不用自己算 validUntil 或金額快照。
        order.quoteVersions = Array.isArray(data.quoteVersions) ? data.quoteVersions : order.quoteVersions;

        // 成功（含後端回報的冪等重放 idempotentReplay:true）才清除暫存的 key／表單內容，
        // 下一次送出會是全新的發布意圖、產生全新的 key。只重繪報價版本區塊，不重建整個詳情
        // 面板，避免影響人工調價／付款／物流／備註等其他表單裡使用者可能還沒送出的內容——
        // 這個區塊本來就含有btn自己，重繪後舊按鈕會被替換掉，不需要再手動恢復文字。
        clearPendingQuoteVersion(orderId);
        document.getElementById('order-detail-quote-version-section').innerHTML = renderQuoteVersionSectionHtml(order);
      } catch (e) {
        // 失敗（含網路中斷）時保留使用者剛才輸入的內容與 sessionStorage 裡的同一組 key，
        // 不重繪、只顯示錯誤並恢復可編輯；使用者直接重試（或重新整理頁面後再試）都會沿用
        // 同一組 key，後端冪等機制保證就算「其實已經寫入成功、只是回應遺失」也不會重複建立版本。
        errEl.textContent = e.message;
        btn.textContent = originalBtnLabel;
        validDaysEl.disabled = false; notesEl.disabled = false;
      }
    });
  }

  // ─── 狀態時間軸：唯讀顯示，只讀取伺服器端追加式寫入的 statusHistory，
  // 前端完全不會自己組出歷史紀錄（缺欄位就是缺欄位，不猜測、不偽造過去的紀錄）。
  // 舊訂單沒有 statusHistory 欄位時安全視為空陣列，顯示「尚無狀態變更紀錄」。
  function renderStatusHistoryHtml(o) {
    const history = Array.isArray(o.statusHistory) ? o.statusHistory : [];
    const actionLabels = { forward: '前進', regress: '倒退', cancel: '取消', restore: '恢復' };
    const rowsHtml = history.length
      ? history.slice().reverse().map(h => {
          const fromLabel = escHtml(ORDER_STATUS_LABELS[h.from] || h.from || '--');
          const toLabel   = escHtml(ORDER_STATUS_LABELS[h.to]   || h.to   || '--');
          const actionLabel = escHtml(actionLabels[h.action] || h.action || '--');
          return `
            <div class="status-history-item">
              <div class="status-history-main">${fromLabel} → ${toLabel}　<span class="status-history-action">${actionLabel}</span></div>
              <div class="status-history-meta">${escHtml(fmtTime(h.changedAt))} · ${escHtml(h.actor || '--')}</div>
            </div>
          `;
        }).join('')
      : '<div style="color:var(--gray-400);font-size:12.5px;">尚無狀態變更紀錄</div>';
    return `
      <h4>狀態時間軸</h4>
      <div class="status-history-list">${rowsHtml}</div>
    `;
  }

  // ─── 恢復終止狀態：只有訂單目前是「已完成」或「已取消」時才會顯示這個區塊，
  // 一般狀態變更（前進／倒退／取消）都在列表的狀態欄位操作，這裡是唯一能把終止狀態
  // 「復原」回流程的入口，且一定要選定目標狀態＋二次確認才會送出。
  // ─── 訂單封存／還原（詳情頁）：未封存時顯示封存表單（含選填封存原因）；已封存時顯示
  // 封存資訊（時間／人／原因）＋「還原訂單」按鈕，不提供其他任何編輯操作。
  function renderArchiveSectionHtml(o) {
    if (isOrderArchived(o)) {
      return `
        <h4>封存資訊</h4>
        <div style="font-size:12.5px;color:var(--gray-700);line-height:1.8;">
          封存時間：${escHtml(fmtTime(o.archivedAt))}<br>
          封存人：${escHtml(o.archivedBy || '--')}<br>
          封存原因：${escHtml(o.archiveReason || '（未填寫）')}
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;">
          <button id="order-detail-unarchive-btn" onclick="unarchiveOrderFromDetail('${o.orderId}')">還原訂單</button>
        </div>
        <div id="order-detail-archive-error" class="detail-field-error"></div>
      `;
    }
    return `
      <h4>封存訂單</h4>
      <input type="text" id="order-detail-archive-reason" placeholder="封存原因（選填）" maxlength="500" style="width:100%;">
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button id="order-detail-archive-btn" onclick="archiveOrderFromDetail('${o.orderId}')">封存訂單</button>
      </div>
      <div id="order-detail-archive-error" class="detail-field-error"></div>
    `;
  }

  async function archiveOrderFromDetail(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const reasonEl = document.getElementById('order-detail-archive-reason');
    const btn = document.getElementById('order-detail-archive-btn');
    const errEl = document.getElementById('order-detail-archive-error');
    await adminRunAction(btn, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認封存訂單',
        message: `確定要封存訂單「${order.friendlyOrderNo || orderId}」嗎？封存後這筆訂單會移到「已封存」頁籤。`,
        confirmLabel: '確認封存'
      });
      if (!confirmed) return; // 取消確認時完全不呼叫API

      errEl.textContent = '';
      reasonEl.disabled = true;
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/archive`, {
          method: 'POST',
          body: JSON.stringify({ confirm: true, archiveReason: reasonEl.value })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '封存失敗');
        // 封存成功後這筆訂單不再屬於「目前訂單」頁籤，關閉詳情視窗並從列表移除即可，
        // 不需要整批重新呼叫 API（跟列表快速操作 archiveOrderRow() 是同一套邏輯）。
        orders = orders.filter(o => o.orderId !== orderId);
        closeOrderDetail();
        renderTable();
      } catch (e) {
        errEl.textContent = e.message;
        reasonEl.disabled = false;
      }
    });
  }

  async function unarchiveOrderFromDetail(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const btn = document.getElementById('order-detail-unarchive-btn');
    const errEl = document.getElementById('order-detail-archive-error');
    await adminRunAction(btn, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認還原訂單',
        message: `確定要還原訂單「${order.friendlyOrderNo || orderId}」嗎？還原後這筆訂單會移回「目前訂單」頁籤。`,
        confirmLabel: '確認還原'
      });
      if (!confirmed) return;

      errEl.textContent = '';
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/unarchive`, {
          method: 'POST',
          body: JSON.stringify({ confirm: true })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '還原失敗');
        orders = orders.filter(o => o.orderId !== orderId);
        closeOrderDetail();
        renderTable();
      } catch (e) {
        errEl.textContent = e.message;
      }
    });
  }

  function renderStatusSectionHtml(o) {
    if (isOrderArchived(o)) return ''; // 已封存訂單不提供狀態編輯／恢復，唯讀由 renderArchiveSectionHtml() 處理
    const status = orderStatus(o);
    if (!TERMINAL_STATUSES.includes(status)) return '';
    // 恢復的定義是把終止狀態的訂單拉回正常流程，目標只能是非終止的流程狀態；
    // 不可以選到「已完成」或「已取消」——那應該是正常走完流程或再次取消，不是「恢復」。
    const restoreOptions = ORDER_STATUS_FLOW.filter(s => !TERMINAL_STATUSES.includes(s));
    return `
      <h4>恢復訂單狀態</h4>
      <div style="color:var(--gray-400);font-size:12.5px;margin-bottom:6px;">
        此訂單目前為終止狀態（${escHtml(ORDER_STATUS_LABELS[status])}），如需變更請選擇要恢復到的狀態並二次確認。
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="order-detail-restore-select">
          ${restoreOptions.map(s => `<option value="${s}">${escHtml(ORDER_STATUS_LABELS[s])}</option>`).join('')}
        </select>
        <button id="order-detail-restore-btn" onclick="restoreOrderStatus('${o.orderId}')">恢復</button>
      </div>
      <div id="order-detail-restore-error" class="detail-field-error"></div>
    `;
  }

  async function restoreOrderStatus(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const select = document.getElementById('order-detail-restore-select');
    const btn    = document.getElementById('order-detail-restore-btn');
    const errEl  = document.getElementById('order-detail-restore-error');
    const target = select.value;
    await adminRunAction(btn, null, async () => {
      const { confirmed } = await adminConfirmDialog({
        title: '確認恢復訂單狀態',
        message: `確定要將此訂單從終止狀態恢復為「${ORDER_STATUS_LABELS[target]}」嗎？`,
        danger: true,
        confirmLabel: '確認恢復'
      });
      if (!confirmed) return; // 取消確認時完全不呼叫API，按鈕與下拉選單維持原狀

      errEl.textContent = '';
      select.disabled = true;
      try {
        const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/restore-status`, {
          method: 'POST',
          body: JSON.stringify({ status: target, confirm: true })
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error((data && data.error) || '恢復失敗');
        order.status = data.status;
        order.statusUpdatedAt = data.statusUpdatedAt;
        order.statusHistory = data.statusHistory;
        // 恢復後狀態本身跟「是否為終止狀態」都變了，整個詳情面板一起重繪最保險，
        // 避免只重繪單一區塊卻讓其他區塊顯示的狀態資訊跟實際情況不一致。
        document.getElementById('order-detail-body').innerHTML = `
          ${renderOrderDetailHtml(order)}
          <div id="order-detail-archive-section">${renderArchiveSectionHtml(order)}</div>
          <div id="order-detail-status-section">${renderStatusSectionHtml(order)}</div>
          <div id="order-detail-history-section">${renderStatusHistoryHtml(order)}</div>
          <div id="order-detail-payment-section">${renderPaymentSectionHtml(order)}</div>
          <div id="order-detail-logistics-section">${renderLogisticsSectionHtml(order)}</div>
          <div id="order-detail-assignee-section">${renderAssigneeSectionHtml(order)}</div>
          <div id="order-detail-notes-section">${renderNotesSectionHtml(order)}</div>
        `;
        renderTable(); // 列表的狀態欄位（badge／下拉選單）也要跟著換掉
      } catch (e) {
        errEl.textContent = e.message;
        select.disabled = false;
      }
    });
  }

  // ─── 訂單負責人：純文字欄位，空白代表尚未指派（用 placeholder 顯示，不佔用實際內容）──
  function renderAssigneeSectionHtml(o) {
    const assignee = o.assignee || '';
    // 已封存訂單只顯示目前的負責人文字，不提供輸入框與儲存按鈕（避免修改唯讀訂單）。
    if (isOrderArchived(o)) {
      return `
        <h4>訂單負責人</h4>
        <div style="font-size:13px;color:var(--gray-700);">${escHtml(assignee || '尚未指派')}</div>
      `;
    }
    return `
      <h4>訂單負責人</h4>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="order-detail-assignee-input" value="${escHtml(assignee)}" placeholder="尚未指派" maxlength="50" style="flex:1;">
        <button id="order-detail-assignee-save-btn" onclick="saveOrderAssignee('${o.orderId}')">儲存</button>
      </div>
      <div id="order-detail-assignee-error" class="detail-field-error"></div>
    `;
  }

  async function saveOrderAssignee(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const input = document.getElementById('order-detail-assignee-input');
    const btn = document.getElementById('order-detail-assignee-save-btn');
    const errEl = document.getElementById('order-detail-assignee-error');
    const value = input.value;

    btn.disabled = true;
    input.disabled = true;
    errEl.textContent = '';
    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/assignee`, {
        method: 'POST',
        body: JSON.stringify({ assignee: value })
      });
      const data = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((data && data.error) || '訂單負責人更新失敗');
      order.assignee = data.assignee;
      // 成功後立即用伺服器回傳的實際值重繪，畫面跟後端資料一定一致（不是直接信任使用者輸入的原始字串）。
      document.getElementById('order-detail-assignee-section').innerHTML = renderAssigneeSectionHtml(order);
    } catch (e) {
      // 失敗時保留使用者剛才輸入的內容，只顯示錯誤訊息並恢復可編輯，不重繪、不清空輸入框。
      errEl.textContent = e.message;
      btn.disabled = false;
      input.disabled = false;
    }
  }

  // ─── 內部備註：追加式紀錄，畫面上新到舊排序，永遠不提供編輯或刪除舊紀錄的功能 ──
  function renderNotesSectionHtml(o) {
    const notes = Array.isArray(o.internalNotes) ? o.internalNotes : [];
    const notesHtml = notes.length
      ? notes.slice().reverse().map(n => `
          <div class="internal-note-item">
            <div class="internal-note-meta">${escHtml(fmtTime(n.createdAt))} · ${escHtml(n.actor || '--')}</div>
            <div class="internal-note-content">${escHtml(n.content)}</div>
          </div>
        `).join('')
      : '<div style="color:var(--gray-400);font-size:12.5px;">尚無內部備註</div>';
    // 已封存訂單只顯示既有備註清單，不提供新增備註的輸入框與按鈕（避免修改唯讀訂單）。
    if (isOrderArchived(o)) {
      return `
        <h4>內部備註（僅後台可見，與客戶備註分開存放）</h4>
        <div class="internal-note-list">${notesHtml}</div>
      `;
    }
    return `
      <h4>內部備註（僅後台可見，與客戶備註分開存放）</h4>
      <div class="internal-note-list">${notesHtml}</div>
      <textarea id="order-detail-note-input" maxlength="2000" rows="3" placeholder="新增一筆內部備註…" style="width:100%;margin-top:8px;"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button id="order-detail-note-add-btn" onclick="addInternalNote('${o.orderId}')">新增備註</button>
      </div>
      <div id="order-detail-note-error" class="detail-field-error"></div>
    `;
  }

  async function addInternalNote(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const textarea = document.getElementById('order-detail-note-input');
    const btn = document.getElementById('order-detail-note-add-btn');
    const errEl = document.getElementById('order-detail-note-error');
    const content = textarea.value;

    btn.disabled = true;
    textarea.disabled = true;
    errEl.textContent = '';
    try {
      const resp = await adminFetch(`/api/orders/${encodeURIComponent(orderId)}/internal-notes`, {
        method: 'POST',
        body: JSON.stringify({ content })
      });
      const data = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((data && data.error) || '備註新增失敗');
      order.internalNotes = data.internalNotes;
      // 重繪整個備註區塊：連帶重建一個全新的空白 textarea，等同「送出後自動清空輸入框」。
      document.getElementById('order-detail-notes-section').innerHTML = renderNotesSectionHtml(order);
    } catch (e) {
      // 失敗時保留使用者剛才輸入的備註內容，不清空 textarea，只顯示錯誤並恢復可編輯。
      errEl.textContent = e.message;
      btn.disabled = false;
      textarea.disabled = false;
    }
  }

  function closeOrderDetail() {
    document.getElementById('order-detail-modal').classList.add('hidden');
  }

  // 每一列缺漏的欄位都要顯示「--」，不能因為舊訂單缺欄位就出現 undefined／NaN／Invalid Date
  // 或整頁壞掉——所有數字/時間都經過 fmtMoney()／fmtQty()／fmtTime() 統一處理。
  function renderOrderDetailHtml(o) {
    const status = orderStatus(o);
    const rows = [
      ['訂單編號', escHtml(o.friendlyOrderNo || o.orderId || '--')],
      ['建立時間', escHtml(fmtTime(o.savedAt))],
      ['客戶姓名', escHtml(o.contact?.name || '--')],
      ['Email', escHtml(o.contact?.email || '--')],
      ['電話', escHtml(o.contact?.phone || '--')],
      ['客戶備註', escHtml(o.contact?.note || '--')],
      ['商品名稱', escHtml(o.product?.name || '--')],
      ['材質', escHtml(o.product?.material || '--')],
      ['工藝', escHtml(o.product?.finish || '--')],
      ['容量', escHtml(o.product?.capacity || '--')],
      ['數量', fmtQty(o.product?.qty)],
      ['單價', fmtMoney(o.quote?.unitPrice)],
      ['小計', fmtMoney(o.quote?.subtotal)],
      ['開版／設置費', fmtMoney(o.quote?.setupFee)],
      ['預估總額', fmtMoney(o.quote?.total)],
      ['訂單狀態', escHtml((ORDER_STATUS_LABELS[status] || status || '--') + (TERMINAL_STATUSES.includes(status) ? '（終止狀態）' : ''))],
      ['狀態更新時間', escHtml(fmtTime(o.statusUpdatedAt))],
      ['工廠包下載時間', escHtml(fmtTime(o.factoryPackageDownloadedAt))],
      ['封存狀態', isOrderArchived(o) ? '已封存' : '未封存']
    ];
    return `<div style="display:flex;justify-content:space-between;align-items:center;">`
      + `<h3>訂單詳情</h3>`
      + `<button class="btn btn-primary btn-sm" onclick="printOrder('${o.orderId}')">列印</button>`
      + `</div>`
      + '<table class="order-detail-table">'
      + rows.map(([label, value]) => `<tr><th>${escHtml(label)}</th><td>${value}</td></tr>`).join('')
      + '</table>';
  }

  // ─── 訂單列印：純前端功能，直接讀取記憶體內已載入的 orders 資料組出「後台內部
  // 訂單工作單」，不新增任何 API、不把管理密碼放進網址，也不呼叫任何寫入 API。
  // 用專用的 #print-area 區塊＋CSS「印刷時把 body 其他內容全部隱藏」的技巧，
  // 確保 window.print() 只印出這一筆訂單，不會印到後台導覽列/篩選器/表單/其他訂單。
  // 所有動態文字一律經過 escHtml()，缺欄位一律顯示「--」，不猜測、不偽造資料。
  function buildPrintHtml(o) {
    const status = orderStatus(o);
    const paymentSummary = computePaymentSummary(o);
    const logisticsSummary = computeLogisticsSummary(o);
    const latest = logisticsSummary.latest;
    const notes = Array.isArray(o.internalNotes) ? o.internalNotes.slice().reverse() : [];
    const history = Array.isArray(o.statusHistory) ? o.statusHistory.slice().reverse() : [];
    const actionLabels = { forward: '前進', regress: '倒退', cancel: '取消', restore: '恢復' };

    const notesHtml = notes.length
      ? notes.map(n => `
          <div class="print-list-item">
            <div class="print-list-content">${escHtml(n.content || '--')}</div>
            <div class="print-list-meta">${escHtml(fmtTime(n.createdAt))} · ${escHtml(n.actor || '--')}</div>
          </div>`).join('')
      : '<div class="print-empty">尚無內部備註</div>';

    const historyHtml = history.length
      ? history.map(h => `
          <div class="print-list-item">
            <div class="print-list-content">${escHtml(ORDER_STATUS_LABELS[h.from] || h.from || '--')} → ${escHtml(ORDER_STATUS_LABELS[h.to] || h.to || '--')}　${escHtml(actionLabels[h.action] || h.action || '--')}</div>
            <div class="print-list-meta">${escHtml(fmtTime(h.changedAt))} · ${escHtml(h.actor || '--')}</div>
          </div>`).join('')
      : '<div class="print-empty">尚無狀態變更紀錄</div>';

    return `
      <div class="print-header">
        <h1>楊竹科技 — 後台內部訂單工作單</h1>
        <div class="print-meta">列印時間：${escHtml(fmtTime(new Date().toISOString()))}</div>
      </div>

      <table class="print-table">
        <tr><th>訂單編號</th><td>${escHtml(o.friendlyOrderNo || o.orderId || '--')}</td>
            <th>建立時間</th><td>${escHtml(fmtTime(o.savedAt))}</td></tr>
        <tr><th>訂單狀態</th><td>${escHtml(ORDER_STATUS_LABELS[status] || status || '--')}</td>
            <th>封存狀態</th><td>${isOrderArchived(o) ? '已封存' : '未封存'}</td></tr>
        <tr><th>訂單負責人</th><td colspan="3">${escHtml(o.assignee || '尚未指派')}</td></tr>
      </table>

      <h2>客戶資訊</h2>
      <table class="print-table">
        <tr><th>客戶姓名</th><td>${escHtml(o.contact?.name || '--')}</td>
            <th>Email</th><td>${escHtml(o.contact?.email || '--')}</td></tr>
        <tr><th>電話</th><td colspan="3">${escHtml(o.contact?.phone || '--')}</td></tr>
      </table>

      <h2>商品資訊</h2>
      <table class="print-table">
        <tr><th>商品名稱</th><td>${escHtml(o.product?.name || '--')}</td>
            <th>數量</th><td>${fmtQty(o.product?.qty)}</td></tr>
        <tr><th>材質</th><td>${escHtml(o.product?.material || '--')}</td>
            <th>工藝</th><td>${escHtml(o.product?.finish || '--')}</td></tr>
        <tr><th>容量</th><td colspan="3">${escHtml(o.product?.capacity || '--')}</td></tr>
      </table>

      <h2>報價資訊</h2>
      <table class="print-table">
        <tr><th>單價</th><td>${fmtMoney(o.quote?.unitPrice)}</td>
            <th>小計</th><td>${fmtMoney(o.quote?.subtotal)}</td></tr>
        <tr><th>其他費用</th><td>${fmtMoney(o.quote?.setupFee)}</td>
            <th>總額</th><td>${fmtMoney(o.quote?.total)}</td></tr>
      </table>

      <h2>付款摘要</h2>
      <table class="print-table">
        <tr><th>付款狀態</th><td>${escHtml(PAYMENT_STATUS_LABELS[paymentSummary.paymentStatus] || '--')}</td>
            <th>累計收款</th><td>${fmtMoney(paymentSummary.totalReceived)}</td></tr>
        <tr><th>累計退款</th><td>${fmtMoney(paymentSummary.totalRefunded)}</td>
            <th>實收金額</th><td>${fmtMoney(paymentSummary.netReceived)}</td></tr>
        <tr><th>尚欠金額</th><td colspan="3">${paymentSummary.owed === null ? '--' : fmtMoney(paymentSummary.owed)}</td></tr>
      </table>

      <h2>物流摘要</h2>
      <table class="print-table">
        <tr><th>最新物流狀態</th><td>${latest ? escHtml(LOGISTICS_STATUS_LABELS[latest.status] || latest.status || '--') : '--'}</td>
            <th>物流商</th><td>${latest ? escHtml(latest.carrier || '--') : '--'}</td></tr>
        <tr><th>追蹤單號</th><td colspan="3">${latest ? escHtml(latest.trackingNumber || '--') : '--'}</td></tr>
      </table>

      <h2>內部備註</h2>
      <div class="print-list">${notesHtml}</div>

      <h2>狀態歷程</h2>
      <div class="print-list">${historyHtml}</div>
    `;
  }

  // 上一次註冊的 afterprint 清除函式：每次列印前先移除舊的監聽再重新註冊一個新的，
  // 避免使用者連續列印多筆訂單時，舊的監聽疊加造成清除邏輯被重複觸發。
  let printCleanupHandler = null;

  // 列印只讀取 orders 記憶體資料組字串塞進 #print-area，完全不呼叫任何 fetch／寫入 API，
  // 不會、也不可能修改 orders、訂單 JSON、付款、物流、狀態或封存欄位。
  function printOrder(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;
    const area = document.getElementById('print-area');
    area.innerHTML = buildPrintHtml(order);

    if (printCleanupHandler) {
      window.removeEventListener('afterprint', printCleanupHandler);
    }
    // afterprint 在使用者實際列印完成或取消列印對話框後都會觸發，用它來清空暫存內容，
    // 避免 #print-area 一直殘留上一筆訂單的資料（雖然畫面上本來就看不到，但清乾淨較安全）。
    printCleanupHandler = function () {
      area.innerHTML = '';
      window.removeEventListener('afterprint', printCleanupHandler);
      printCleanupHandler = null;
    };
    window.addEventListener('afterprint', printCleanupHandler);

    window.print();
  }

  // 匯出「目前篩選結果」（跟畫面上表格顯示的是同一份 getFilteredOrders()），
  // 不是全部訂單，確保畫面跟下載內容不會對不上。改用後端 /api/orders/export 產生真正的
  // .xlsx（原本是純前端組CSV文字），防呆機制：isExportingOrders旗標防止連續重複點擊，
  // 按鈕在下載期間disable並顯示「匯出中…」。
  let isExportingOrders = false;
  async function exportOrdersXlsx() {
    if (isExportingOrders) return;
    const filtered = getFilteredOrders();
    if (!filtered.length) {
      alert('目前篩選結果沒有任何訂單可以匯出，請調整篩選條件');
      return;
    }
    const btn = document.getElementById('btn-export-orders-xlsx');
    const originalText = btn.textContent;
    isExportingOrders = true;
    btn.disabled = true;
    btn.textContent = '匯出中…';
    try {
      const rows = filtered.map(o => ({
        orderNo: o.friendlyOrderNo || '', time: fmtTime(o.savedAt), name: o.contact?.name || '',
        email: o.contact?.email || '', phone: o.contact?.phone || '',
        product: o.product?.name || '', material: o.product?.material || '', finish: o.product?.finish || '',
        qty: o.product?.qty || 0, total: o.quote?.total || 0,
        status: ORDER_STATUS_LABELS[orderStatus(o)] || '', downloaded: o.factoryPackageDownloadedAt ? '是' : '否',
        note: (o.contact?.note || '').replace(/\n/g, ' ')
      }));
      const resp = await adminFetch('/api/orders/export', { method: 'POST', body: JSON.stringify({ rows }) });
      if (!resp.ok) {
        const data = await resp.json().catch(() => null);
        throw new Error((data && data.error) || '匯出失敗，請稍後再試');
      }
      await adminDownloadBlob(resp, `楊竹訂單_${new Date().toISOString().slice(0,10)}.xlsx`);
    } catch (e) {
      alert(e.message || '匯出失敗，請稍後再試');
    } finally {
      isExportingOrders = false;
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // 自動登入：確認伺服器端Session（HttpOnly Cookie）是否仍然有效，有效才直接進入後台，
  // 不需要、也不可能再從localStorage讀回密碼。
  (async function init() {
    const ok = await checkAdminSession();
    if (!ok) return;
    const loaded = await prepareAdminAppData();
    if (loaded) showAdminApp();
  })();

  document.getElementById('gate-username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('gate-input').focus();
  });
  document.getElementById('gate-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
</script>

</body>
</html>
